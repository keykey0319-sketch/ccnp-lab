<title>CCNP ENCOR Lab Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Arial,sans-serif;font-size:14px;background:#0d1117;color:#c9d1d9;}
#lockScreen{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px;}
#lockScreen h2{color:#c9d1d9;font-size:20px;font-weight:600;}
#lockScreen p{color:#8b949e;font-size:13px;}
#lockInput{background:#161b22;border:1.5px solid #30363d;border-radius:10px;color:#c9d1d9;font-size:26px;padding:14px 20px;text-align:center;outline:none;width:190px;letter-spacing:8px;-webkit-appearance:none;}
#lockInput:focus{border-color:#4a9eff;}
#lockBtn{background:#238636;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;padding:14px 0;cursor:pointer;width:190px;}
#lockErr{color:#f85149;font-size:13px;min-height:18px;}
.app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto;}
.topbar{display:flex;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;}
.topbar-tab{flex:1;padding:11px 4px;text-align:center;color:#8b949e;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;}
.topbar-tab.on{color:#e6edf3;border-bottom-color:#4a9eff;font-weight:600;}
.lsection{display:none;flex-direction:column;}
.lsection.on{display:flex;}
.tcontent{padding:14px;line-height:1.8;overflow-y:auto;flex:1;border-bottom:1px solid #30363d;}
.tcontent b{color:#e6edf3;}
.tcontent ol{padding-left:20px;}
.tcontent li{margin-bottom:8px;font-size:13px;color:#c9d1d9;}
.hl{background:#2d2200;color:#e3b341;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:12px;font-weight:600;}
.qbar{padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;}
.nqbtn{font-size:12px;padding:7px 14px;border-radius:8px;border:1px solid #e3b341;background:transparent;color:#e3b341;cursor:pointer;font-weight:600;}
.catbadge{font-size:11px;padding:2px 8px;border-radius:6px;background:#1c2d1c;color:#3fb950;font-weight:600;}
.tbadge{font-size:11px;padding:2px 8px;border-radius:6px;background:#1c2d3d;color:#4a9eff;font-weight:600;}
.topobox{padding:12px;background:#161b22;overflow-y:auto;flex:1;border-bottom:1px solid #30363d;}
.topo-table{width:100%;border-collapse:collapse;font-size:12px;font-family:monospace;}
.topo-table th{background:#21262d;color:#8b949e;padding:5px 8px;text-align:left;border:1px solid #30363d;}
.topo-table td{padding:5px 8px;border:1px solid #30363d;color:#c9d1d9;}
.topo-table tr:hover td{background:#161b22;}
.devtabs{display:flex;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;}
.dt{flex:1;padding:9px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:#8b949e;text-align:center;}
.dt.on{color:#e6edf3;border-bottom-color:#e6edf3;font-weight:600;}
.term{background:#0d1117;display:flex;flex-direction:column;flex:1;min-height:0;}
.tout{flex:1;padding:10px 12px;font-size:12px;font-family:'Courier New',monospace;color:#c9d1d9;overflow-y:auto;line-height:1.7;white-space:pre-wrap;word-break:break-all;min-height:160px;}
.c-ok{color:#3fb950;}.c-err{color:#f85149;}.c-info{color:#79c0ff;}.c-prompt{color:#e3b341;}.c-hint{color:#6e7681;font-style:italic;}
.acbox{background:#161b22;border-top:1px solid #30363d;font-size:12px;font-family:'Courier New',monospace;max-height:110px;overflow-y:auto;display:none;flex-shrink:0;}
.aci{padding:5px 12px;color:#c9d1d9;cursor:pointer;display:flex;gap:8px;align-items:baseline;border-bottom:0.5px solid #21262d;}
.aci.sel,.aci:active{background:#1f2937;}
.acmd{color:#79c0ff;min-width:140px;font-size:12px;}.adsc{color:#6e7681;font-size:11px;}
.quickbar{display:flex;gap:4px;padding:5px 8px;background:#161b22;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;border-top:1px solid #30363d;}
.quickbar::-webkit-scrollbar{display:none;}
.qk{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.qk:active{background:#2d333b;}
.tin{display:flex;align-items:center;border-top:1px solid #30363d;padding:7px 10px;gap:6px;background:#0d1117;flex-shrink:0;}
.tin span{color:#e3b341;font-size:12px;font-family:'Courier New',monospace;white-space:nowrap;}
#cin{flex:1;background:transparent;border:none;outline:none;color:#c9d1d9;font-size:14px;font-family:'Courier New',monospace;-webkit-appearance:none;}
#runbtn{background:#e3b341;border:none;border-radius:6px;color:#000;font-size:14px;font-weight:700;padding:5px 12px;cursor:pointer;flex-shrink:0;}
#tabbtn{background:#21262d;border:1px solid #30363d;border-radius:6px;color:#79c0ff;font-size:13px;font-weight:700;padding:5px 11px;cursor:pointer;flex-shrink:0;}
.brow{display:flex;gap:6px;padding:7px 10px;border-top:1px solid #30363d;flex-wrap:wrap;background:#161b22;flex-shrink:0;}
.btn{font-size:11px;padding:7px 10px;border-radius:8px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;flex:1;text-align:center;}
.btn:active{background:#2d333b;}
.btng{border-color:#238636;color:#3fb950;}
.sarea{padding:7px 10px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid #30363d;background:#161b22;flex-shrink:0;min-height:8px;}
.bok{font-size:11px;padding:3px 8px;border-radius:6px;background:#0f2318;color:#3fb950;border:1px solid #238636;}
.berr{font-size:11px;padding:3px 8px;border-radius:6px;background:#2d0f0f;color:#f85149;border:1px solid #6e2020;}
@media(min-width:900px){
  .app{flex-direction:row;}
  .left-col{display:flex!important;flex-direction:column;width:44%;border-right:1px solid #30363d;overflow:hidden;}
  .right-col{display:flex!important;flex-direction:column;flex:1;overflow:hidden;}
  .topbar{display:none!important;}
  .lsection{display:flex!important;flex:1;overflow:hidden;}

  /* body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;}  // ← 기존: app을 직접 고정하는 방식으로 대체 */

/* [추가] 핸드폰(좁은 화면) 최적화 — 아이패드(>=900 / 768) 레이아웃은 건드리지 않음 */
@media(max-width:480px){

/* [추가] 브라우저 자동 다크모드(강제 어둡게)가 영역을 반전시키지 못하도록 + Task 배경 명시 */

<script>
// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function pad(s,n){s=String(s);while(s.length<n)s+=' ';return s;}
function h(v){return '<span class="hl">'+v+'</span>';}

// ═══════════════════════════════════════════════════════════════
// QUESTION GENERATORS — 100% matching real exam structure
// ═══════════════════════════════════════════════════════════════

// ── NF-A: Flow Exporter (destination + UDP) + SPAN single-source + SLA schedule ──
// Real exam: Task says "using UDP port X" and "to interface Y using session Z"
// PC1's Sw1 port = NOT in tasks, must find from topology table

// ════════════════════════════════════════════════════════
// QUESTION GENERATORS — PDF 원본 값 하드코딩
// 숫자(op번호, UDP포트, session, 주소 등)만 변형
// ════════════════════════════════════════════════════════

// 공통 토폴로지 데이터 (Q1~Q6 전부 동일한 Sw1 구조)
// R1 e0/0=10.10.1.2, Sw1 VLAN10=10.10.1.1, VLAN12=10.12.1.1, VLAN14=10.14.1.1
// PC1 VLAN12=10.12.1.2, PC2 VLAN14=10.14.1.2, Sw1 Lo0=2.2.2.2

function nfTopoRows(r1ip, swV10, swV12, swV14, pc1ip, pc2ip){
  return [
    {dev:'R1',   iface:'e0/0',    ip:r1ip},
    {dev:'Sw1',  iface:'VLAN 10', ip:swV10},
    {dev:'Sw1',  iface:'VLAN 12', ip:swV12},
    {dev:'Sw1',  iface:'VLAN 14', ip:swV14},
    {dev:'PC1',  iface:'VLAN 12', ip:pc1ip},
    {dev:'PC2',  iface:'VLAN 14', ip:pc2ip}
  ];
}

function nfShowRun(r1ip, swV10, swV12, swV14, sw1Lo, expName, monName, slaOp){
  return {
    R1:[
      '!','hostname R1','!',
      'interface Loopback0',' ip address 1.1.1.1 255.255.255.255','!',
      'interface Ethernet0/0',' ip address '+r1ip+' 255.255.255.0','!',
      'flow exporter '+expName,
      ' ! ← NOT YET CONFIGURED','!',
      'flow monitor '+monName,
      ' exporter '+expName,
      ' cache timeout active 60',
      ' record netflow ipv4 original-input','!',
      'ip sla '+slaOp,
      ' ! ← NOT YET SCHEDULED','!',
      'ip route 0.0.0.0 0.0.0.0 '+swV10,'!','end'
    ],
    Sw1:[
      '!','hostname Sw1','!',
      'interface Loopback0',' ip address '+sw1Lo+' 255.255.255.255','!',
      'interface Vlan10',' ip address '+swV10+' 255.255.255.0',' no shutdown','!',
      'interface Vlan12',' ip address '+swV12+' 255.255.255.0',' no shutdown','!',
      'interface Vlan14',' ip address '+swV14+' 255.255.255.0',' no shutdown','!',
      'interface Ethernet0/0',' switchport trunk encapsulation dot1q',' switchport mode trunk','!',
      'interface Ethernet0/1',' switchport access vlan 12',' switchport mode access',
      '! ← PC1 is on this port (VLAN 12)','!',
      'interface Ethernet0/2',' switchport access vlan 14',' switchport mode access',
      '! ← PC2 is on this port (VLAN 14)','!',
      'ip routing','!','end'
    ]
  };
}

function nfShowBrief(r1ip, swV10, sw1Lo){
  return {
    R1:['Interface              IP-Address      OK? Method Status   Protocol',
        'Loopback0              1.1.1.1         YES manual up      up',
        'Ethernet0/0            '+r1ip+'   YES manual up      up'],
    Sw1:['Interface              IP-Address      OK? Method Status   Protocol',
         'Loopback0              '+sw1Lo+'    YES manual up      up',
         'Vlan10                 '+swV10+'   YES manual up      up',
         'Vlan12                 10.12.1.1       YES manual up      up',
         'Vlan14                 10.14.1.1       YES manual up      up']
  };
}

// ── Q1 유형: UDP port + SPAN single source(e0/1) + SLA schedule ──
// PDF Q1: UDP 2055, session 11, dest e1/1, SLA op 100, exporter Export-NetFlowENCOR
function makeNF_A(){
  var udp    = rnd([2055, 9996, 4739, 6343]);
  var sess   = rnd([1, 2, 5, 7, 10, 11, 12, 15, 20]);
  var slaOp  = rnd([1, 5, 10, 50, 100, 200]);
  var dst    = rnd(['e1/1','e1/2','e1/3','e2/0','e2/1']);
  var expName= rnd(['Export-NetFlowENCOR','Export-NetFlowData','NETFLOW-EXP','NF-COLLECTOR']);
  var monName= rnd(['Monitor-FlowR1','Monitor-NetFlowR1','NF-MONITOR','FlowMon-R1']);
  var r1ip='10.10.1.2', swV10='10.10.1.1', sw1Lo='2.2.2.2';
  var swV12='10.12.1.1', swV14='10.14.1.1', pc1ip='10.12.1.2', pc2ip='10.14.1.2';
  return {
    cat:'NetFlow/SPAN/SLA', sub:'A', devs:['R1','Sw1'],
    taskIntro:'The Operations team started configuring several monitoring activities. Complete the configurations for the tasks below.',
    tasks:[
      'Complete the Flexible NetFlow <b>Flow Exporter</b> configuration on R1 to send data to the collector using <span class="hl">UDP port '+udp+'</span>.',
      'Configure the switch port analyzer on Sw1 and mirror all communication to and from PC1 to interface <span class="hl">'+dst+'</span> using session number <span class="hl">'+sess+'</span>.',
      'Schedule the pre-configured IP SLA operation on R1 to start running <b>immediately</b> and to run <b>indefinitely</b>.'
    ],
    vars:{udp,sess,slaOp,dst,expName,monName,spanDst:dst,vlanTrunk:10,vlanPC1:12,vlanPC2:14,r1ip,swV10,sw1Lo,pc1ip,pc2ip},
    showRun: nfShowRun(r1ip,swV10,swV12,swV14,sw1Lo,expName,monName,slaOp),
    showIpIntBrief: nfShowBrief(r1ip,swV10,sw1Lo),
    topoRows: nfTopoRows(r1ip,swV10,swV12,swV14,pc1ip,pc2ip),
    topoType:'netflow',
    checks:[
      {l:'R1: flow exporter '+expName+' → transport udp '+udp, ok:function(sc){return sc.nfDone;}},
      {l:'Sw1: monitor session '+sess+' source interface e0/1 both', ok:function(sc){return sc.spanSrc;}},
      {l:'Sw1: monitor session '+sess+' destination interface '+dst, ok:function(sc){return sc.spanDst;}},
      {l:'R1: ip sla schedule '+slaOp+' life forever start-time now', ok:function(sc){return sc.slaDone;}}
    ],
    solution:{
      R1:['R1>enable','R1#configure terminal',
          'R1(config)#flow exporter '+expName,
          'R1(config-flow-exporter)#transport udp '+udp,
          'R1(config-flow-exporter)#exit',
          'R1(config)#ip sla schedule '+slaOp+' life forever start-time now',
          'R1(config)#end','R1#write memory'],
      Sw1:['Sw1>enable','Sw1#configure terminal',
           'Sw1(config)#monitor session '+sess+' source interface e0/1 both',
           'Sw1(config)#monitor session '+sess+' destination interface '+dst,
           'Sw1(config)#end','Sw1#write memory']
    }
  };
}

// ── Q2 유형: Flow Exporter destination IP + SPAN multi-source(e0/1,e0/2) + HTTP GET ──
// PDF Q2: dest 10.10.1.10, session 2, dest e1/0, HTTP GET http://10.10.1.100 freq 600
function makeNF_B(){
  var destIP = rnd(['10.10.1.10','10.10.1.100','10.20.1.10','192.168.1.100']);
  var freq   = rnd([60,120,300,600]);
  var sess   = rnd([1,2,3,5,7,10,11,12]);
  var slaOp  = rnd([1,5,10,50,100]);
  var dst    = rnd(['e1/0','e1/1','e1/2','e2/0']);
  var expName= rnd(['Export-NetFlowENCOR','Export-NetFlowData','NETFLOW-EXP']);
  var r1ip='10.10.1.2', swV10='10.10.1.1', sw1Lo='2.2.2.2';
  var swV12='10.12.1.1', swV14='10.14.1.1', pc1ip='10.12.1.2', pc2ip='10.14.1.2';
  return {
    cat:'NetFlow/SPAN/SLA', sub:'B', devs:['R1','Sw1'],
    taskIntro:'The Operations team started configuring several monitoring activities. Complete the configurations for the tasks below.',
    tasks:[
      'Complete the Flexible NetFlow <b>Flow Exporter</b> configuration on R1 to send data to the collector located at <span class="hl">'+destIP+'</span>.',
      'Configure the switch port analyzer on Sw1 and mirror all communication to and from PC1 and PC2 to interface <span class="hl">'+dst+'</span> using session number <span class="hl">'+sess+'</span>.',
      'Configure a basic IP SLA <b>HTTP GET</b> operation on R1 to monitor the server at <span class="hl">http://'+destIP+'</span> every <span class="hl">'+freq+' seconds</span>.'
    ],
    vars:{destIP,freq,sess,slaOp,dst,expName,spanDst:dst,vlanTrunk:10,vlanPC1:12,vlanPC2:14,r1ip,swV10,sw1Lo,pc1ip,pc2ip},
    showRun: nfShowRun(r1ip,swV10,swV12,swV14,sw1Lo,expName,'Monitor-FlowR1',slaOp),
    showIpIntBrief: nfShowBrief(r1ip,swV10,sw1Lo),
    topoRows: nfTopoRows(r1ip,swV10,swV12,swV14,pc1ip,pc2ip),
    topoType:'netflow',
    checks:[
      {l:'R1: flow exporter → destination '+destIP, ok:function(sc){return sc.nfDone;}},
      {l:'Sw1: session '+sess+' source e0/1,e0/2 both', ok:function(sc){return sc.spanSrc;}},
      {l:'Sw1: session '+sess+' destination '+dst, ok:function(sc){return sc.spanDst;}},
      {l:'R1: http get http://'+destIP+' freq '+freq+' + scheduled', ok:function(sc){return sc.slaDone;}}
    ],
    solution:{
      R1:['R1>enable','R1#configure terminal',
          'R1(config)#flow exporter '+expName,
          'R1(config-flow-exporter)#destination '+destIP,
          'R1(config-flow-exporter)#exit',
          'R1(config)#ip sla '+slaOp,
          'R1(config-ip-sla)#http get http://'+destIP,
          'R1(config-ip-sla-http)#frequency '+freq,
          'R1(config-ip-sla-http)#exit',
          'R1(config)#ip sla schedule '+slaOp+' life forever start-time now',
          'R1(config)#end','R1#write memory'],
      Sw1:['Sw1>enable','Sw1#configure terminal',
           'Sw1(config)#monitor session '+sess+' source interface e0/1,e0/2 both',
           'Sw1(config)#monitor session '+sess+' destination interface '+dst,
           'Sw1(config)#end','Sw1#write memory']
    }
  };
}

// ── Q3 유형: ip flow monitor on E0/0 + SPAN VLAN source + ICMP to Sw1 Loopback ──
// PDF Q3: session 10, source vlan 10, dest e0/3, ICMP Sw1 Lo(2.2.2.2) freq 300, SLA op 10
function makeNF_C(){
  var sess   = rnd([5,7,10,11,12,15,20]);
  var slaOp  = rnd([1,5,10,50,100]);
  var dst    = rnd(['e0/3','e1/0','e1/1','e1/2','e1/3']);
  var freq   = rnd([60,120,300,600]);
  var monName= rnd(['Monitor-FlowR1','Monitor-NetFlowR1','NF-MONITOR','FlowMon-R1']);
  var sw1Lo  = rnd(['2.2.2.2','3.3.3.3','5.5.5.5','10.1.1.1']);
  var r1ip='10.10.1.2', swV10='10.10.1.1';
  var swV12='10.12.1.1', swV14='10.14.1.1', pc1ip='10.12.1.2', pc2ip='10.14.1.2';
  return {
    cat:'NetFlow/SPAN/SLA', sub:'C', devs:['R1','Sw1'],
    taskIntro:'The Operations team started configuring several monitoring activities. Complete the configurations for the tasks below.',
    tasks:[
      'Enable Flexible NetFlow on R1 E0/0 in <b>both directions</b> using the pre-configured flow monitor.',
      'Configure the switch port analyzer on Sw1 and mirror all VLAN <span class="hl">10</span> traffic to interface <span class="hl">'+dst+'</span> using session number <span class="hl">'+sess+'</span>.',
      'Configure a basic IP SLA <b>ICMP echo</b> operation on R1 to ping Sw1\'s Loopback interface every <span class="hl">'+freq+' seconds</span>. Then schedule it to start immediately and run indefinitely.'
    ],
    vars:{sess,slaOp,dst,freq,monName,sw1Lo,spanDst:dst,vlanTrunk:10,vlanPC1:12,vlanPC2:14,r1ip,swV10,pc1ip,pc2ip},
    showRun:{
      R1:['!','hostname R1','!',
          'interface Ethernet0/0',' ip address '+r1ip+' 255.255.255.0',
          ' ! ip flow monitor ← NOT YET CONFIGURED','!',
          'flow monitor '+monName,' cache timeout active 60',' record netflow ipv4 original-input','!',
          'ip sla '+slaOp,' ! ← NOT YET SCHEDULED','!',
          'ip route 0.0.0.0 0.0.0.0 '+swV10,'!','end'],
      Sw1:['!','hostname Sw1','!',
           'interface Loopback0',' ip address '+sw1Lo+' 255.255.255.255','!',
           'interface Vlan10',' ip address '+swV10+' 255.255.255.0',' no shutdown','!',
           'interface Ethernet0/0',' switchport trunk encapsulation dot1q',' switchport mode trunk','!',
           'interface Ethernet0/1',' switchport access vlan 12',' switchport mode access','! ← PC1','!',
           'interface Ethernet0/2',' switchport access vlan 14',' switchport mode access','! ← PC2','!',
           'ip routing','!','end']
    },
    showIpIntBrief:{
      R1:['Interface              IP-Address      OK? Method Status   Protocol',
          'Loopback0              1.1.1.1         YES manual up      up',
          'Ethernet0/0            '+r1ip+'   YES manual up      up'],
      Sw1:['Interface              IP-Address      OK? Method Status   Protocol',
           'Loopback0              '+sw1Lo+'    YES manual up      up',
           'Vlan10                 '+swV10+'   YES manual up      up']
    },
    topoRows: nfTopoRows(r1ip,swV10,swV12,swV14,pc1ip,pc2ip),
    topoType:'netflow',
    checks:[
      {l:'R1: ip flow monitor '+monName+' input (E0/0)', ok:function(sc){return sc.nfIn;}},
      {l:'R1: ip flow monitor '+monName+' output (E0/0)', ok:function(sc){return sc.nfOut;}},
      {l:'Sw1: session '+sess+' source vlan 10 both', ok:function(sc){return sc.spanSrc;}},
      {l:'Sw1: session '+sess+' destination '+dst, ok:function(sc){return sc.spanDst;}},
      {l:'R1: icmp-echo '+sw1Lo+' freq '+freq+' + scheduled', ok:function(sc){return sc.slaDone;}}
    ],
    solution:{

// ── EIGRP+CoPP ──
// PDF Q15: R2(ACL 151 eigrp), R3(CoPP SSH 192.168.211.0/24 8000bps)
function makeCoPP(){
  var aclDev = rnd(['R2','R3']);
  var coppDev= aclDev==='R2'?'R3':'R2';
  var aclNum = rnd([120,150,151,160]);
  var proto  = rnd(['eigrp','ospf']);
  var coppProto= rnd(['SSH','Telnet','ICMP']);
  var netBase= rnd(['192.168.210','192.168.211','192.168.213','192.168.24']);
  var rate   = rnd([8000,9000,10000]);
  var cmapName=coppProto;
  var permitLine=coppProto==='SSH'?'permit tcp '+netBase+'.0 0.0.0.255 any eq 22':
                 coppProto==='Telnet'?'permit tcp '+netBase+'.0 0.0.0.255 any eq telnet':
                 'permit icmp '+netBase+'.0 0.0.0.255 any';
  return {
    cat:'EIGRP+CoPP', sub:'A', devs:[aclDev,coppDev],
    taskIntro:'EIGRP is preconfigured on all routers. Configure '+aclDev+' and '+coppDev+' to complete these tasks.',
    tasks:[
      '<b>Task 1 ('+aclDev+'):</b> Modify the existing ACL on '+aclDev+' so that '+proto.toUpperCase()+' routes are received from R1 and R3.<ul style="margin-top:6px;line-height:2;padding-left:20px;"><li>The modification should only allow '+proto.toUpperCase()+' routes to pass.</li><li>Do not remove any configuration from '+aclDev+' to achieve this task.</li></ul>',
      '<b>Task 2 ('+coppDev+'):</b> Configure CoPP on '+coppDev+' to achieve these results:<ul style="margin-top:6px;line-height:2;padding-left:20px;"><li>Permit '+coppProto+' traffic from <span class="hl">'+netBase+'.0/24</span>.</li><li>Limit traffic to <span class="hl">'+rate+' bps</span>.</li><li>Discard additional packets.</li></ul>'
    ],
    vars:{aclDev,coppDev,aclNum,proto,coppProto,netBase,rate,cmapName,permitLine,spanDst:null,vlanTrunk:null,vlanPC1:null,vlanPC2:null},
    showRun:{
      [aclDev]:['!','hostname '+aclDev,'!',
                'ip access-list extended '+aclNum,' 10 permit ip any any',
                '! ← 5 permit '+proto+' any any 추가 필요 (삭제 금지)','!',
                'router eigrp 1',' network 0.0.0.0','!','end'],
      [coppDev]:['!','hostname '+coppDev,'!',
                 'router eigrp 1',' network 0.0.0.0','!',
                 '! CoPP not yet configured','!','end']
    },
    showIpIntBrief:{
      [aclDev]:['Interface              IP-Address      OK? Method Status   Protocol',
                'Ethernet0/0            192.168.213.2   YES manual up      up'],
      [coppDev]:['Interface              IP-Address      OK? Method Status   Protocol',
                 'Ethernet0/0            192.168.213.3   YES manual up      up']
    },
    showACL:{
      [aclDev]:'Extended IP access list '+aclNum+'\n    10 permit ip any any'
    },
    topoRows:[
      {dev:aclDev,  iface:'e0/0', ip:'192.168.213.2/24 — Task1: ACL 수정'},
      {dev:coppDev, iface:'e0/0', ip:'192.168.213.3/24 — Task2: CoPP 설정'}
    ],
    topoType:'copp',
    checks:[
      {l:aclDev+': ACL '+aclNum+' → 5 permit '+proto+' any any 추가', ok:function(sc){return sc.aclDone;}},
      {l:coppDev+': ip access-list extended '+cmapName, ok:function(sc){return sc.coppAcl;}},
      {l:coppDev+': class-map match-any '+cmapName, ok:function(sc){return sc.cmapDone;}},
      {l:coppDev+': police '+rate+' transmit/drop', ok:function(sc){return sc.policeDone;}},
      {l:coppDev+': service-policy input COPP', ok:function(sc){return sc.cpDone;}}
    ],
    solution:{
      [aclDev]:[
        aclDev+'>enable',aclDev+'#configure terminal',
        aclDev+'(config)#ip access-list extended '+aclNum,
        aclDev+'(config-ext-nacl)#5 permit '+proto+' any any',
        aclDev+'(config-ext-nacl)#end',aclDev+'#write memory'],
      [coppDev]:[
        coppDev+'>enable',coppDev+'#configure terminal',
        coppDev+'(config)#ip access-list extended '+cmapName,
        coppDev+'(config-ext-nacl)#'+permitLine,
        coppDev+'(config-ext-nacl)#exit',
        coppDev+'(config)#class-map match-any '+cmapName,
        coppDev+'(config-cmap)#match access-group name '+cmapName,
        coppDev+'(config-cmap)#exit',
        coppDev+'(config)#policy-map COPP',
        coppDev+'(config-pmap)#class '+cmapName,
        coppDev+'(config-pmap-c)#police '+rate+' conform-action transmit exceed-action drop',
        coppDev+'(config-pmap-c)#control-plane',
        coppDev+'(config-cp)#service-policy input COPP',
        coppDev+'(config-cp)#end',coppDev+'#write memory']
    }
  };
}

function buildPool(){
  POOL=[];
  // PDF 원본 문제 (숫자 그대로)
  POOL.push(makeQ1());   // Q1: UDP 2055, sess 11, dst e1/1
  POOL.push(makeQ2());   // Q2: dest 10.10.1.10, HTTP GET freq 600
  POOL.push(makeQ3());   // Q3: flow monitor, VLAN10, dst e0/3, ICMP freq 300
  POOL.push(makeQ4());   // Q4: dest 10.10.1.110, HTTP GET freq 300, SPAN sess 7
  POOL.push(makeQ5());   // Q5: flow monitor, ICMP 5.5.5.5 freq 60, SPAN sess 5
  POOL.push(makeQ6());   // Q6: flow monitor, ICMP PC1 freq 300, SPAN VLAN12
  POOL.push(makeQ7());   // Q7: OSPF R20 pid20 Area40 /18
  POOL.push(makeQ8());   // Q8: OSPF R30 pid10 Area50 /17
  POOL.push(makeQ9());   // Q9: VRF R11 Tunnel10 dst 209.165.201.6
  POOL.push(makeQ10());  // Q10: VRF R22 Tunnel10 dst 209.165.200.230
  POOL.push(makeQ11());  // Q11: EC Po10 old Po11 VLAN 10,20
  POOL.push(makeQ13());  // Q13: eBGP AS65200 R2
  POOL.push(makeQ15());  // Q15: CoPP R2(ACL151) R3(SSH 8000bps)
  // 숫자만 바꾼 변형 문제
  [makeNF_A,makeNF_B,makeNF_C,makeNF_D].forEach(function(f){for(var i=0;i<4;i++)POOL.push(f());});
  [makeOSPF_A,makeOSPF_B].forEach(function(f){for(var i=0;i<3;i++)POOL.push(f());});
  [makeVRF,makeEC,makeBGP,makeCoPP].forEach(function(f){for(var i=0;i<2;i++)POOL.push(f());});
  // 셔플
  for(var i=POOL.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=POOL[i];POOL[i]=POOL[j];POOL[j]=t;}
  POOL_IDX=0;
}

function initSC(){

  if(c==='EtherChannel+STP') return {noOldPo:false,lacp:false,poTrunk:false,stpRoot:false};
  if(c==='eBGP') return {bgpProc:false,bgpRid:false,bgpNeigh:false,bgpAf:false,bgpNet:false,bgpNetCnt:0};

  return {};
}

function ensureTopoLB(){
  var lb=document.getElementById('topoLB');
  if(lb) return lb;
  lb=document.createElement('div'); lb.id='topoLB';
  lb.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px;';
  var im=document.createElement('img'); im.id='topoLBimg'; im.style.cssText='max-width:100%;max-height:100%;';
  lb.appendChild(im); lb.onclick=function(){lb.style.display='none';};
  document.body.appendChild(lb); return lb;
}
function renderTopoImage(box){
  var src = TOPO_IMG[CQ.topoType];
  if(!src) return false;
  var wrap=document.createElement('div'); wrap.style.cssText='padding:10px;text-align:center;';
  var img=document.createElement('img'); img.src=src; img.alt='topology';
  img.style.cssText='max-width:100%;height:auto;border-radius:8px;border:1px solid #21262d;cursor:zoom-in;';
  img.onclick=function(){var lb=ensureTopoLB();document.getElementById('topoLBimg').src=src;lb.style.display='flex';};
  wrap.appendChild(img);
  var cap=document.createElement('div'); cap.style.cssText='margin-top:6px;font-size:11px;color:#6e7681;';
  cap.textContent='탭하면 확대 · 실제 시험 토폴로지'; wrap.appendChild(cap);
  if(CQ.topoRows && CQ.topoRows.length){
    var tb=document.createElement('div');
    tb.style.cssText='margin-top:10px;font-size:12px;color:#9aa4b1;text-align:left;line-height:1.7;border-top:1px solid #21262d;padding-top:8px;';
    tb.innerHTML=CQ.topoRows.map(function(r){return '<div>'+[r.dev,r.iface,r.ip].filter(Boolean).join(' &nbsp;·&nbsp; ')+'</div>';}).join('');
    wrap.appendChild(tb);
  }
  box.appendChild(wrap); return true;
}

function buildTopo(){
  var v=CQ.vars, type=CQ.topoType;
  var box=document.getElementById('topoContent');
  box.innerHTML='';
  if(renderTopoImage(box)) return; // [NEW] 실제 이미지 사용 (아래 SVG는 보존)
  var ns='http://www.w3.org/2000/svg';

  function mkSVG(w,h){
    var s=document.createElementNS(ns,'svg');
    s.setAttribute('viewBox','0 0 '+w+' '+h);
    s.setAttribute('width','100%');
    s.style.display='block';
    s.style.maxHeight='300px';
    return s;
  }
  function E(tag,a){
    var e=document.createElementNS(ns,tag);
    if(a) Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});
    return e;
  }
  // 텍스트 헬퍼
  function T(x,y,txt,fill,fs,anc){
    var t=E('text',{x:x,y:y,'text-anchor':anc||'middle','font-size':fs||10,
      fill:fill||'#c9d1d9','font-family':'Arial,sans-serif'});
    t.textContent=String(txt); return t;
  }
  // 선
  function L(x1,y1,x2,y2,clr,dash){
    return E('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:clr||'#6e7681',
      'stroke-width':1.5,'stroke-dasharray':dash||'0'});
  }
  // 라우터 아이콘 (원, 이름은 아래 별도 텍스트)
  function R(cx,cy,name,fc,sc){
    var g=E('g');
    g.appendChild(E('circle',{cx:cx,cy:cy,r:16,fill:fc||'#1a3a1a',stroke:sc||'#3fb950','stroke-width':2}));
    var t=E('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':8,'font-weight':'bold',
      fill:'#fff','font-family':'Arial,sans-serif'});
    t.textContent=name.length<=3?name:name.slice(0,3); g.appendChild(t);
    var lb=E('text',{x:cx,y:cy+28,'text-anchor':'middle','font-size':9,
      fill:sc||'#3fb950','font-family':'Arial,sans-serif'});
    lb.textContent=name; g.appendChild(lb);
    return g;
  }
  // 스위치 아이콘 (사각형)
  function SW(cx,cy,name){
    var g=E('g');
    g.appendChild(E('rect',{x:cx-20,y:cy-12,width:40,height:24,rx:3,
      fill:'#0d2140',stroke:'#4a9eff','stroke-width':2}));
    var t=E('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':7,'font-weight':'bold',
      fill:'#79c0ff','font-family':'Arial,sans-serif'});
    t.textContent=name; g.appendChild(t);
    var lb=E('text',{x:cx,y:cy+26,'text-anchor':'middle','font-size':9,
      fill:'#4a9eff','font-family':'Arial,sans-serif'});
    lb.textContent=name; g.appendChild(lb);
    return g;
  }
  // PC 아이콘
  function PC(cx,cy,name){
    var g=E('g');
    g.appendChild(E('rect',{x:cx-14,y:cy-10,width:28,height:18,rx:2,
      fill:'#21262d',stroke:'#555','stroke-width':1.5}));
    g.appendChild(E('rect',{x:cx-7,y:cy+8,width:14,height:4,rx:1,fill:'#555'}));
    var lb=E('text',{x:cx,y:cy+26,'text-anchor':'middle','font-size':9,
      fill:'#8b949e','font-family':'Arial,sans-serif'});
    lb.textContent=name; g.appendChild(lb);
    return g;
  }

  var svg=null;

  // ── NetFlow/SPAN/SLA (Q1~Q6 정확한 레이아웃) ──
  // PDF 토폴로지: R1(좌상) -- VLAN10 -- Sw1(우상)
  //               Sw1 e0/1 -- VLAN12 -- PC1(좌하)
  //               Sw1 e0/2 -- VLAN14 -- PC2(우하)
  if(type==='netflow'){
    var vT=v.vlanM||v.vlanTrunk||10;
    var vP1=v.vlanP1||v.vlanPC1||12;
    var vP2=v.vlanP2||v.vlanPC2||14;
    svg=mkSVG(380,240);
    // 선 먼저 (노드 뒤에 깔리게)
    svg.appendChild(L(72,65,265,50));      // R1-Sw1 (VLAN10 트렁크)
    svg.appendChild(L(252,65,155,185));    // Sw1-PC1 (VLAN P1)
    svg.appendChild(L(280,65,300,185));    // Sw1-PC2 (VLAN P2)
    // 노드
    svg.appendChild(R(52,65,'R1','#0d2d0d','#3fb950'));
    svg.appendChild(SW(285,50,'Sw1'));
    svg.appendChild(PC(140,198,'PC1'));
    svg.appendChild(PC(305,198,'PC2'));
    // 인터페이스 레이블 (선 중간 근처, 겹치지 않는 빈 공간)
    svg.appendChild(T(163,42,'e0/0','#6e7681',8));
    svg.appendChild(T(163,52,'VLAN '+vT,'#4a9eff',8));
    svg.appendChild(T(186,140,'e0/1  VLAN '+vP1,'#e3b341',8));
    svg.appendChild(T(320,128,'e0/2','#8b949e',8));
    svg.appendChild(T(320,138,'VLAN '+vP2,'#8b949e',8));
    // SPAN destination 배너 (상단)
    if(v.spanDst){
      svg.appendChild(E('rect',{x:2,y:2,width:140,height:16,rx:2,fill:'#1c0808',stroke:'#6e2020','stroke-width':1}));
      svg.appendChild(T(71,13,'SPAN dst: '+v.spanDst,'#f85149',8));
    }
    // 하단 힌트
    svg.appendChild(T(190,230,'Sw1 show run → e0/1=PC1(VLAN '+vP1+')  e0/2=PC2(VLAN '+vP2+')','#6e7681',8));

  // ── OSPF (Q7~Q8 정확한 레이아웃) ──
  // PDF: R10(위중앙) - R20(좌하) - R30(우하) 삼각형
  //      10.10.20.0/24 (R10-R20), 10.10.30.0/24 (R10-R30), 10.20.30.0/24 (R20-R30)
  //      R20 e0/2 → Area40 → R40
  //      R30 e0/2 → Area50 → R50
  } else if(type==='ospf'){
    var dN=v.devName||'R20', stub=v.stub||40;
    var isR20=dN==='R20', isR30=dN==='R30';
    svg=mkSVG(380,280);
    // Area 0 원
    svg.appendChild(E('ellipse',{cx:190,cy:118,rx:108,ry:78,fill:'none',
      stroke:'#1a3a6b','stroke-width':1.2,'stroke-dasharray':'5,3'}));
    svg.appendChild(T(190,52,'Area 0','#4a9eff',11));
    // 삼각형 연결선
    svg.appendChild(L(190,60,110,158));
    svg.appendChild(L(190,60,270,158));
    svg.appendChild(L(110,158,270,158));
    // 서브넷 레이블 (선 중간)
    svg.appendChild(T(136,100,'10.10.20.0/24','#555',7));
    svg.appendChild(T(245,100,'10.10.30.0/24','#555',7));
    svg.appendChild(T(190,168,'10.20.30.0/24','#555',7));
    // Area 연결선 (stub)
    svg.appendChild(L(110,174,55,238,'#555','4,3'));
    svg.appendChild(L(270,174,325,238,'#555','4,3'));
    // 라우터 노드
    svg.appendChild(R(190,60,'R10','#1c1c1c','#555'));
    svg.appendChild(R(110,158,isR20?dN:'R20',isR20?'#0d2140':'#1c1c1c',isR20?'#4a9eff':'#555'));
    svg.appendChild(R(270,158,isR30?dN:'R30',isR30?'#0d2140':'#1c1c1c',isR30?'#4a9eff':'#555'));
    svg.appendChild(R(55,242,'R40','#181818','#444'));
    svg.appendChild(R(325,242,'R50','#181818','#444'));
    // Area 레이블
    svg.appendChild(T(55,232,'Area '+(stub===40||stub==='40'?40:50),'#e3b341',8));
    svg.appendChild(T(325,232,'Area '+(stub===50||stub==='50'?50:40),'#e3b341',8));
    // e0/2 레이블
    svg.appendChild(T(70,206,'e0/2','#e3b341',8));
    svg.appendChild(T(315,206,'e0/2','#e3b341',8));
    // 설정 대상 표시
    svg.appendChild(T(190,272,dN+' = 설정 대상','#4a9eff',9));

  // ── VRF+Tunnel (Q9~Q10 정확한 레이아웃) ──
  // PDF: ISP(위) - R11(좌하) - R22(우하)
  //      209.165.200.228/30 (ISP-R11), 209.165.201.0/30 (ISP-R22)
  //      Tunnel10: 10.10.10.0/30 점선

function getMode(){return devStates[curDev]?devStates[curDev].mode||'user':'user';}
function setMode(m){if(devStates[curDev])devStates[curDev].mode=m;}
function getDS(){return devStates[curDev]||{};}

function getPrompt(){
  var m=getMode(),b=curDev;
  var map={'user':b+'>','exec':b+'#','config':b+'(config)#','config-router':b+'(config-router)#','config-if':b+'(config-if)#','config-if-range':b+'(config-if-range)#','config-flow-exporter':b+'(config-flow-exporter)#','config-ip-sla':b+'(config-ip-sla)#','config-ip-sla-http':b+'(config-ip-sla-http)#','config-router-af':b+'(config-router-af)#','config-ext-nacl':b+'(config-ext-nacl)#','config-cmap':b+'(config-cmap)#','config-pmap':b+'(config-pmap)#','config-pmap-c':b+'(config-pmap-c)#','config-cp':b+'(config-cp)#','conf-keyring':b+'(conf-keyring)#'};
  return map[m]||b+'>';
}
function updPrompt(){document.getElementById('plbl').textContent=getPrompt();}

function tprint(txt,cls){
  var o=document.getElementById('tout');
  var d=document.createElement('div');if(cls)d.className=cls;
  d.textContent=txt;o.appendChild(d);o.scrollTop=o.scrollHeight;
}
// [추가] 터미널을 항상 맨 아래로 (모바일 키보드 대응)
function scrollTermBottom(){var o=document.getElementById('tout');if(o){o.scrollTop=o.scrollHeight;}}
function unk(c){tprint('% Invalid input detected at "^" marker','c-err');tprint('% '+c,'c-err');}
function norm(c){return c.trim().replace(/\s+/g,' ');}
// [FIX] 인터페이스 이름 정규화: Ethernet0/1, Eth0/1, Et0/1, e0/1 → 모두 'e0/1' 로 통일
function normIf(s){return String(s==null?'':s).trim().toLowerCase().replace(/^(ethernet|ether|eth|et|e)\s*/,'e');}

function runCmd(raw){
  var cmd=norm(raw);if(!cmd)return;
  tprint(getPrompt()+' '+cmd,'c-prompt');
  var m=getMode(),cl=cmd.toLowerCase();
  // universal commands
  if(cl==='enable'||cl==='en'){if(m==='user'){setMode('exec');return;} }
  if(cl==='configure terminal'||cl==='conf t'){if(m==='exec'){setMode('config');tprint('Enter configuration commands, one per line.  End with CNTL/Z.','c-info');return;}}
  if(cl==='end'||cl==='^z'){if(m!=='user'){setMode('exec');tprint('%SYS-5-CONFIG_I: Configured from console by console','c-info');}return;}
  if(cl==='exit'){ var pm={exec:'user',config:'exec','config-router':'config','config-if':'config','config-if-range':'config','config-flow-exporter':'config','config-ip-sla':'config','config-ip-sla-http':'config-ip-sla','config-router-af':'config-router','config-ext-nacl':'config','config-cmap':'config','config-pmap':'config','config-pmap-c':'config-pmap','config-cp':'config','conf-keyring':'config'};setMode(pm[m]||'user');return;}
  if(cl==='wr'||cl==='write memory'||cl==='copy running-config startup-config'){tprint('Building configuration...[OK]','c-ok');return;}
  if(m==='user'){unk(cmd);return;}
  if(m==='exec'&&cl.startsWith('show ')){doShow(cmd,cl);return;}
  // dispatch by category
  var cat=CQ.cat;
  if(cat==='NetFlow/SPAN/SLA') procSLA(cmd,cl,m);
  else if(cat==='OSPF') procOSPF(cmd,cl,m);
  else if(cat==='VRF+Tunnel') procVRF(cmd,cl,m);
  else if(cat==='EtherChannel+STP') procEC(cmd,cl,m);
  else if(cat==='eBGP') procBGP(cmd,cl,m);
  else if(cat==='EIGRP+CoPP') procCoPP(cmd,cl,m);
  else unk(cmd);
  updPrompt();
}

// ── show commands ──
function doShow(cmd,cl){
  var v=CQ.vars, cat=CQ.cat;
  var showLines = (CQ.showRun&&CQ.showRun[curDev])||[];
  var briefLines = (CQ.showIpIntBrief&&CQ.showIpIntBrief[curDev])||[];

  var isShowRun = cl==='show running-config' || cl==='show run' || cl==='show running' || cl.startsWith('show run') && !cl.includes('int');
  if(isShowRun){
    tprint('Building configuration...','c-info');tprint('','');
    tprint('Current configuration:','c-info');tprint('!','c-info');
    showLines.forEach(function(l){
      if(l===undefined||l===null) return;
      var cls='';
      if(l.startsWith('!')) cls='c-info';
      else if(l.includes('NOT YET')||l.includes('<--')||l.includes('NOT CONFIGURED')) cls='c-err';
      else if(l.startsWith(' !')) cls='c-err';
      tprint(l,cls);
    });
    // add what user has configured so far (green)
    if(cat==='NetFlow/SPAN/SLA'){
      if(SC.nfDone&&v.udp) tprint(' transport udp '+v.udp+' (✓ configured)','c-ok');
      if(SC.nfDone&&v.destIP) tprint(' destination '+v.destIP+' (✓ configured)','c-ok');
      if(SC.nfIn) tprint('! ip flow monitor '+v.monName+' input ✓','c-ok');
      if(SC.nfOut) tprint('! ip flow monitor '+v.monName+' output ✓','c-ok');
      if(SC.slaDone) tprint('ip sla schedule '+v.slaOp+' life forever start-time now ✓','c-ok');
      if(SC.spanSrc) tprint('monitor session '+v.sess+' source ... ✓','c-ok');
      if(SC.spanDst) tprint('monitor session '+v.sess+' destination ... ✓','c-ok');
    } else if(cat==='OSPF'){
      if(SC.ospfProc) tprint('router ospf '+v.pid+' ✓','c-ok');
      if(SC.ospfRid) tprint(' router-id '+v.loopIP+' ✓','c-ok');
      if(SC.ospfRange) tprint(' area '+v.stub+' range '+v.summNet+' '+v.summMask+' ✓','c-ok');
      if(SC.ospfIface) tprint(' ip ospf '+v.pid+' area 0 (on interfaces) ✓','c-ok');
      if(SC.ospfStub) tprint(' ip ospf '+v.pid+' area '+v.stub+' (Eth0/2) ✓','c-ok');
    } else if(cat==='eBGP'){
      if(SC.bgpProc) tprint('router bgp '+v.localAs+' ✓','c-ok');
      if(SC.bgpRid) tprint(' bgp router-id '+v.rid+' ✓','c-ok');
      if(SC.bgpNeigh) tprint(' neighbor '+v.neigh1+' remote-as '+v.as2+' ✓','c-ok');
      if(SC.bgpNet) tprint(' network statements ✓','c-ok');
    } else if(cat==='EtherChannel+STP'){
      if(SC.noOldPo) tprint('! Port-channel'+v.oldPo+' removed ✓','c-ok');
      if(SC.lacp) tprint('! channel-group '+v.poNum+' mode active ✓','c-ok');
      if(SC.stpRoot) tprint('spanning-tree vlan '+v.vlans+' priority 0 ✓','c-ok');
    }
    tprint('end','c-info');
    return;
  }
  if(cl.includes('ip int brief')||cl.includes('ip interface brief')){
    tprint('Interface              IP-Address      OK? Method Status   Protocol','c-info');
    briefLines.forEach(function(l){tprint(l,'');});
    return;
  }
  if(cl.includes('run int lo')){
    var loNum=cl.match(/lo(\d*)/);var loN=loNum?loNum[1]||'0':'0';
    tprint('interface Loopback'+loN,'c-info');
    if(cat==='OSPF') tprint(' ip address '+v.loopIP+' 255.255.255.255','c-ok');
    else if(cat==='eBGP'&&loN==='0') tprint(' ip address '+v.rid+' 255.255.255.255','c-ok');
    return;
  }
  if(cl.includes('sec sla')){
    tprint('ip sla '+v.slaOp,'c-ok');
    if(SC.slaDone) tprint('ip sla schedule '+v.slaOp+' life forever start-time now','c-ok');
    return;
  }
  if(cl.includes('flow monitor')||cl.includes('flow exporter')){
    if(v.monName) tprint('Flow Monitor '+v.monName+':','c-info');
    if(v.expName) tprint('Flow Exporter '+v.expName+':','c-info');
    if(SC.nfDone) tprint('  Status: Active','c-ok');
    else tprint('  Status: Not fully configured','c-err');
    return;
  }
  if(cl.includes('monitor session')){
    tprint('Session '+(v.sess||'?'),'c-info');
    tprint('Type              : Local Session','');
    if(SC.spanSrc) tprint('Source Ports      : Both: '+(v.srcIf||v.srcIf+','+v.srcIf2||'vlan '+v.vlan),'c-ok');
    else tprint('Source Ports      : None','');
    if(SC.spanDst) tprint('Destination Ports : '+v.spanDst||v.dst||v.dstIf,'c-ok');
    else tprint('Destination Ports : None','');
    return;
  }
  if(cl.includes('access-lists')||cl.includes('access-list')){
    tprint('Extended IP access list '+(v.aclNum||'?'),'c-info');
    tprint('  10 permit ip any any','');
    if(SC.aclDone) tprint('   5 permit '+v.proto+' any any ✓','c-ok');
    return;
  }
  if(cl.includes('ospf')){
    tprint('Routing Process "ospf '+(v.pid||'?')+'" with ID '+(v.loopIP||'unset'),'c-info');
    if(SC.ospfRid) tprint('  Router-ID: '+v.loopIP,'c-ok');
    return;
  }
  if(cl.includes('bgp')){
    tprint('BGP router identifier '+(SC.bgpRid?v.rid:'not set')+', local AS number '+(v.localAs||'?'),'c-info');
    return;
  }
  tprint('% Invalid input or not supported in simulation','c-err');
}

// ── NetFlow/SPAN/SLA processor ──
function procSLA(cmd,cl,m){
  var v=CQ.vars, sub=CQ.sub||CQ.subtype;
  if(m==='config'){
    if((sub==='A'||sub==='B')&&cl==='flow exporter '+v.expName.toLowerCase()){setMode('config-flow-exporter');return;}
    if((sub==='A'||sub==='B')&&cl.startsWith('flow exporter ')){tprint('% Wrong exporter name — run "show run" to verify','c-err');return;}
    if(cl==='ip sla '+v.slaOp){setMode('config-ip-sla');return;}
    if(/^ip sla \d+$/.test(cl)){tprint('% Wrong SLA op number — run "show run | sec sla"','c-err');return;}
    if(cl.startsWith('ip sla schedule ')){
      if(cl.includes(' '+v.slaOp+' ')&&cl.includes('life forever')&&cl.includes('start-time now')){SC.slaDone=true;tprint('');}
      else if(!cl.includes(' '+v.slaOp)) tprint('% Wrong SLA op number','c-err');
      else tprint('% Syntax: ip sla schedule <op> life forever start-time now','c-err');
      return;
    }
    if((sub==='C'||sub==='D')&&(cl==='interface ethernet0/0'||cl==='int e0/0'||cl==='int ethernet0/0')){setMode('config-if');return;}
    // [FIX] monitor session(SPAN) 명령은 아래 Sw1 SPAN 핸들러로 넘겨야 하므로 여기서 막지 않는다
    // unk(cmd); return;   // ← 기존: 이 줄이 monitor session 명령까지 삼켜서 "Invalid input"이 떴음
    if(!/^monitor session /i.test(cl)){ unk(cmd); return; }
  }
  if(m==='config-flow-exporter'){
    if(sub==='A'&&cl.startsWith('transport udp ')){
      var p=parseInt(cl.split(' ')[2]);
      if(p===v.udp){SC.nfDone=true;tprint('');}else tprint('% Wrong UDP port — task requires '+v.udp,'c-err');
      return;
    }
    if(sub==='B'&&cl.startsWith('destination ')){
      var ip=cl.split(' ')[1];
      if(ip===v.destIP){SC.nfDone=true;tprint('');}else tprint('% Wrong IP — task requires '+v.destIP,'c-err');
      return;
    }
    unk(cmd); return;
  }
  if(m==='config-ip-sla'){
    if(sub==='B'&&cl.startsWith('http get ')){
      var url=cmd.substring(9);
      if(url==='http://'+v.destIP){SC.httpSet=true;setMode('config-ip-sla-http');tprint('');}
      else tprint('% Wrong URL — task requires http://'+v.destIP,'c-err');
      return;
    }
    if((sub==='C'||sub==='D')&&cl.startsWith('icmp-echo ')){
      var tgt=sub==='C'?v.loopIP:v.pc1;
      var ip2=cmd.split(' ')[1];
      if(ip2===tgt){SC.icmpSet=true;tprint('');}else tprint('% Wrong target IP — run "show ip int brief" on Sw1 / check topology','c-err');
      return;
    }
    if(cl.startsWith('frequency ')){
      var f=parseInt(cl.split(' ')[1]);
      if(f===v.freq){SC.freqSet=true;if(SC.icmpSet)SC.slaDone=true;tprint('');}
      else tprint('% Wrong frequency — task requires '+v.freq,'c-err');
      return;
    }
    unk(cmd); return;
  }
  if(m==='config-ip-sla-http'){
    if(cl.startsWith('frequency ')){
      var f2=parseInt(cl.split(' ')[1]);
      if(f2===v.freq){SC.httpFreqSet=true;SC.slaDone=true;tprint('');}else tprint('% Wrong frequency','c-err');
      return;
    }
    unk(cmd); return;
  }
  if(m==='config-if'){
    if(cl==='ip flow monitor '+v.monName.toLowerCase()+' input'){SC.nfIn=true;if(SC.nfOut)SC.nfDone=true;tprint('');return;}
    if(cl==='ip flow monitor '+v.monName.toLowerCase()+' output'){SC.nfOut=true;if(SC.nfIn)SC.nfDone=true;tprint('');return;}
    if(cl.startsWith('ip flow monitor ')&&!cl.includes(v.monName.toLowerCase())){tprint('% Wrong monitor name — run "show flow monitor"','c-err');return;}
    unk(cmd); return;
  }
  // Sw1
  if(m==='config'){
    // var sm=cmd.match(/monitor session (\d+) source (vlan (\d+)|interface (\S+)) (both|rx|tx)/i);  // ← 기존: \S+ 라 'Ethernet0/1, Ethernet0/2'(콤마 뒤 공백)를 못 받음
    var sm=cmd.match(/monitor session (\d+) source (vlan (\d+)|interface (.+?)) (both|rx|tx)\s*$/i);  // [FIX] 인터페이스 목록에 공백 허용
    var dm=cmd.match(/monitor session (\d+) destination interface (\S+)/i);
    if(sm){
      var sessOk=parseInt(sm[1])===v.sess, dirOk=sm[5].toLowerCase()==='both', ifOk=false;
      // if(sub==='B'){var pts=sm[4]?sm[4].split(','):[];ifOk=pts.some(function(p){return p.toLowerCase()===v.srcIf.toLowerCase();})&&pts.some(function(p){return p.toLowerCase()===v.srcIf2.toLowerCase();});}  // ← 기존: v.srcIf/srcIf2 미정의 → 항상 실패/에러
      if(sub==='B'){var pts=sm[4]?sm[4].split(',').map(normIf):[];var bA=normIf(v.srcIf||'e0/1'),bB=normIf(v.srcIf2||'e0/2');ifOk=pts.indexOf(bA)>=0&&pts.indexOf(bB)>=0;}  // [FIX] e0/1,e0/2 기준 + 정규화
      else if(sm[3]) ifOk=parseInt(sm[3])===(v.vlan!=null?v.vlan:(v.vlanSrc!=null?v.vlanSrc:v.vlanTrunk));  // [FIX] vlanSrc/vlanTrunk로 폴백
      // else if(sm[4]) ifOk=sm[4].toLowerCase()===v.srcIf.toLowerCase();  // ← 기존: v.srcIf 미정의(sub A/D)
      else if(sm[4]) ifOk=normIf(sm[4])===normIf(v.spanSrc||v.srcIf||'e0/1');  // [FIX] spanSrc(sub D)/기본 e0/1(sub A) + 정규화
      if(sessOk&&ifOk&&dirOk){SC.spanSrc=true;tprint('');}
      else if(!sessOk) tprint('% Wrong session number — task requires '+v.sess,'c-err');
      else if(!ifOk) tprint('% Wrong source interface/vlan — check the task','c-err');
      else tprint('% Direction must be "both"','c-err');
      return;
    }
    if(dm){
      // var sOk=parseInt(dm[1])===v.sess, iOk=dm[2].toLowerCase()===v.spanDst||v.dst||v.dstIf.toLowerCase();  // ← 기존: 연산자 우선순위/undefined 위험
      // var expDst=(v.spanDst||v.dst||v.dstIf||'').toLowerCase();  // ← 기존: 약어만 인정
      var expDst=normIf(v.spanDst||v.dst||v.dstIf||'');  // [FIX] 풀네임도 인정
      var sOk=parseInt(dm[1])===v.sess, iOk=(normIf(dm[2])===expDst);
      if(sOk&&iOk){SC.spanDst=true;tprint('');}
      else if(!sOk) tprint('% Wrong session — task requires '+v.sess,'c-err');
      else tprint('% Wrong destination — task requires '+v.spanDst||v.dst||v.dstIf,'c-err');
      return;
    }
    unk(cmd);
  }
}

// ── OSPF processor ──
function procOSPF(cmd,cl,m){
  var v=CQ.vars;
  if(m==='config'){
    if(cl==='router ospf '+v.pid){SC.ospfProc=true;setMode('config-router');return;}
    if(/^router ospf \d+$/.test(cl)){tprint('% Wrong process ID — task requires '+v.pid,'c-err');return;}
    if(cl.startsWith('interface range ')||cl.startsWith('int range ')){devStates[curDev].inRange=true;setMode('config-if-range');return;}
    if(cl.startsWith('interface ')||cl.startsWith('int ')){devStates[curDev].inRange=false;var ifn=cl.replace(/^int(erface)?\s+/,'');devStates[curDev].lastIf=ifn;setMode('config-if');return;}
    unk(cmd); return;
  }
  if(m==='config-router'){
    if(cl.startsWith('router-id ')){
      if(cmd.split(' ')[1]===v.loopIP){SC.ospfRid=true;tprint('');}else tprint('% Wrong router-id — run "show run int lo0" to verify','c-err');
      return;
    }
    if(cl.startsWith('area ')&&cl.includes('range ')){
      if(cl.includes('area '+v.stub)&&cl.includes(v.summNet)){SC.ospfRange=true;tprint('');}
      else if(!cl.includes('area '+v.stub)) tprint('% Wrong area — task requires area '+v.stub,'c-err');
      else tprint('% Wrong network — check the summary range','c-err');
      return;
    }
    if(cl.startsWith('network ')){
      var parts=cl.split(' '); var area=parts[parts.length-1];
      if(area==='0'){SC.ospfNet=true;tprint('');}
      else{SC.ospfNetStub=true;tprint('');}
      return;
    }
    unk(cmd); return;
  }
  if(m==='config-if'||m==='config-if-range'){
    if(cl.startsWith('ip ospf '+v.pid+' area ')){
      var areaN=cl.split('area ')[1].trim();
      if(areaN==='0'){SC.ospfIface=true;tprint('');}
      else if(areaN===String(v.stub)){SC.ospfStub=true;tprint('');}
      else tprint('% Wrong area number','c-err');
      return;
    }
    if(cl.startsWith('ip ospf ')&&!cl.startsWith('ip ospf '+v.pid)){tprint('% Wrong OSPF process ID — task requires '+v.pid,'c-err');return;}
    if(cl.startsWith('interface ')||cl.startsWith('int ')){var ifn2=cl.replace(/^int(erface)?\s+/,'');devStates[curDev].lastIf=ifn2;setMode('config-if');return;}
    unk(cmd); return;
  }
  unk(cmd);
}

// ── VRF+Tunnel processor ──
function procVRF(cmd,cl,m){
  var v=CQ.vars;
  if(m==='config'){
    if(cl.startsWith('interface ')||cl.startsWith('int ')){
      var ifn=cl.replace(/^int(erface)?\s+/,'').trim();
      devStates[curDev].curIf=ifn; setMode('config-if'); return;
    }
    if(cl.startsWith('ip route vrf ')){
      if(cl.includes(v.vrf.toLowerCase())){SC.vrfRoute=true;tprint('');}else tprint('% Wrong VRF name','c-err');
      return;
    }
    unk(cmd); return;
  }
  if(m==='config-if'){
    if(cl.startsWith('ip vrf forwarding ')){
      var vn=cmd.split(' ')[3];
      if(vn.toLowerCase()===v.vrf.toLowerCase()){
        if((devStates[curDev].curIf||'').startsWith('tunnel')) SC.tunVrf=true;
        else SC.vrfIface=true;
        tprint('% Interface not in VRF before. All addresses removed.','c-err');tprint('');
      } else tprint('% Wrong VRF name — task requires '+v.vrf,'c-err');
      return;
    }
    if(cl.startsWith('ip address ')){tprint('');return;}
    if(cl==='no shutdown'){tprint('%LINK-3-UPDOWN: changed state to up','c-ok');return;}
    if(cl.startsWith('tunnel source ')){devStates[curDev].tunSrc=true;if(devStates[curDev].tunDst)SC.tunSrcDst=true;tprint('');return;}
    if(cl.startsWith('tunnel destination ')){devStates[curDev].tunDst=true;if(devStates[curDev].tunSrc)SC.tunSrcDst=true;tprint('');return;}
    if(cl.startsWith('tunnel vrf ')){tprint('');return;}
    if(cl.startsWith('tunnel mode ')){tprint('');return;}
    unk(cmd); return;
  }
  unk(cmd);
}

// ── EtherChannel+STP processor ──
function procEC(cmd,cl,m){
  var v=CQ.vars;
  if(m==='config'){
    if(cl.startsWith('no interface port-channel')){SC.noOldPo=true;tprint('');return;}
    if(cl.startsWith('interface range ')||cl.startsWith('int range ')){setMode('config-if-range');return;}
    if(cl.startsWith('interface port-channel')||cl.startsWith('int port-channel')){setMode('config-if');return;}
    if(cl.startsWith('spanning-tree vlan ')&&cl.includes('priority 0')){SC.stpRoot=true;tprint('');return;}
    if(cl.startsWith('spanning-tree vlan ')&&!cl.includes('priority 0')){tprint('% Must use priority 0 to ensure root','c-err');return;}
    unk(cmd); return;
  }
  if(m==='config-if-range'){
    if(cl==='switchport trunk encapsulation dot1q'){tprint('');return;}
    if(cl==='switchport mode trunk'){tprint('');return;}
    if(cl.startsWith('channel-group ')&&cl.includes('mode active')){SC.lacp=true;tprint('');return;}
    if(cl.startsWith('channel-group ')&&cl.includes('mode on')){tprint('% mode "on" does not negotiate LACP — use "mode active"','c-err');return;}
    if(cl==='no shutdown'){tprint('');return;}
    unk(cmd); return;
  }
  if(m==='config-if'){
    if(cl==='switchport trunk encapsulation dot1q'){tprint('');return;}
    if(cl==='switchport mode trunk'){SC.poTrunk=true;tprint('');return;}
    if(cl==='no shutdown'){tprint('');return;}
    unk(cmd); return;
  }
  unk(cmd);
}

// ── eBGP processor ──
function procBGP(cmd,cl,m){
  var v=CQ.vars;
  if(m==='config'){
    if(cl==='router bgp '+v.localAs){SC.bgpProc=true;setMode('config-router');return;}
    if(/^router bgp \d+$/.test(cl)){tprint('% Wrong AS number — task requires AS '+v.localAs,'c-err');return;}
    unk(cmd); return;
  }
  if(m==='config-router'){
    if(cl.startsWith('bgp router-id ')){
      if(cmd.split(' ')[2]===v.rid){SC.bgpRid=true;tprint('');}else tprint('% Wrong router-id — run "show ip int brief" to verify Loopback0','c-err');
      return;
    }
    if(cl.startsWith('neighbor ')&&cl.includes('remote-as')){SC.bgpNeigh=true;tprint('');return;}
    if(cl==='address-family ipv4'){SC.bgpAf=true;setMode('config-router-af');return;}
    unk(cmd); return;
  }
  if(m==='config-router-af'){
    if(cl.startsWith('neighbor ')&&cl.endsWith('activate')){tprint('');return;}
    if(cl.startsWith('network ')){SC.bgpNet=true;tprint('');return;}
    unk(cmd); return;
  }
  unk(cmd);
}

// ── EIGRP+CoPP processor ──
function procCoPP(cmd,cl,m){
  var v=CQ.vars;
  if(m==='config'){
    if(cl.startsWith('ip access-list extended ')){setMode('config-ext-nacl');return;}
    if(cl.startsWith('class-map match-any ')){SC.cmapDone=true;setMode('config-cmap');return;}
    if(cl.toLowerCase()==='policy-map copp'){SC.pmapDone=true;setMode('config-pmap');return;}
    unk(cmd); return;
  }
  if(m==='config-ext-nacl'){
    if(cl.includes('permit '+v.proto+' any any')||cl.includes('permit eigrp any any')||cl.includes('permit ospf any any')){
      if(curDev===v.aclDev) SC.aclDone=true;
      else SC.coppAcl=true;
      tprint(''); return;
    }
    if(cl.startsWith('permit tcp ')||cl.startsWith('permit icmp ')||cl.startsWith('permit udp ')){
      SC.coppAcl=true; tprint(''); return;
    }
    unk(cmd); return;
  }
  if(m==='config-cmap'){
    if(cl.startsWith('match access-group name ')){tprint('');return;}
    unk(cmd); return;
  }
  if(m==='config-pmap'){
    if(cl.startsWith('class ')){setMode('config-pmap-c');return;}
    unk(cmd); return;
  }
  if(m==='config-pmap-c'){
    if(cl.startsWith('police ')){
      if(cl.includes(String(v.rate))){SC.policeDone=true;tprint('');}else tprint('% Wrong rate — task requires '+v.rate+' bps','c-err');
      return;
    }
    if(cl==='control-plane'){setMode('config-cp');return;}
    unk(cmd); return;
  }
  if(m==='config-cp'){
    if(cl==='service-policy input copp'){SC.cpDone=true;tprint('');return;}
    unk(cmd); return;
  }
  unk(cmd);
}

function getAC(partial){var p=partial.trim().toLowerCase();var list=getTree();if(!p)return list;return list.filter(function(i){return i.c.toLowerCase().startsWith(p);});}
function cpfx(s){if(!s.length)return '';var p=s[0];for(var i=1;i<s.length;i++){while(s[i].indexOf(p)!==0){p=p.slice(0,-1);if(!p)return '';}}return p;}
function renderAC(m){var box=document.getElementById('acbox');if(!m.length){box.style.display='none';acIdx=-1;return;}box.innerHTML='';m.forEach(function(x,i){var d=document.createElement('div');d.className='aci'+(i===acIdx?' sel':'');d.innerHTML='<span class="acmd">'+x.c+'</span><span class="adsc">'+x.d+'</span>';d.onmousedown=function(e){e.preventDefault();document.getElementById('cin').value=x.c+' ';hideAC();document.getElementById('cin').focus();};box.appendChild(d);});box.style.display='block';}
function hideAC(){document.getElementById('acbox').style.display='none';acIdx=-1;}
function appendInput(t){var cin=document.getElementById('cin');cin.value=t+' ';cin.focus();renderAC(getAC(cin.value));}
// [추가] Tab 자동완성 (폰에는 Tab 키가 없어 버튼으로 호출). 후보는 터미널에 출력.
function doTabComplete(){
  var inp=document.getElementById('cin'); inp.focus();
  var matches=getAC(inp.value);
  if(!inp.value.trim()){var all=getTree();if(all.length){tprint('');all.forEach(function(x){tprint('  '+pad(x.c,48)+x.d,'c-hint');});tprint('');}scrollTermBottom();return;}
  if(matches.length===1){inp.value=matches[0].c+' ';hideAC();}
  else if(matches.length>1){
    var pfx=cpfx(matches.map(function(m){return m.c;}));
    if(pfx.length>inp.value.length)inp.value=pfx;
    tprint('');
    matches.slice(0,12).forEach(function(x){tprint('  '+pad(x.c,48)+x.d,'c-hint');});
    if(matches.length>12)tprint('  ... ('+matches.length+'개 중 12개)','c-hint');
    tprint('');
  } else tprint('% Unrecognized command','c-err');
  scrollTermBottom();
}

function submitCmd(){
  var cin=document.getElementById('cin');var v=cin.value;
  var acVisible=document.getElementById('acbox').style.display!=='none';
  var matches=getAC(v);
  if(acVisible&&acIdx>=0&&matches[acIdx]){cin.value=matches[acIdx].c+' ';hideAC();return;}
  if(v.trim()){if(!devHists[curDev])devHists[curDev]=[];devHists[curDev].unshift(v);}
  histIdx=0;hideAC();
  if(window.innerWidth<900) showTopTab('terminal');
  runCmd(v);cin.value='';updPrompt();cin.focus();
  scrollTermBottom();setTimeout(scrollTermBottom,60);  // [추가] 실행 후/키보드 레이아웃 변동 후 맨 아래로
}

document.addEventListener('DOMContentLoaded',function(){
  var cin=document.getElementById('cin');
  cin.addEventListener('input',function(){acIdx=-1;var v=this.value;if(!v.trim()){hideAC();return;}renderAC(getAC(v));});
  cin.addEventListener('keydown',function(e){
    var inp=this,acV=document.getElementById('acbox').style.display!=='none',matches=getAC(inp.value);
    if(e.key==='Tab'){
      e.preventDefault();
      if(!inp.value.trim()){var all=getTree();if(all.length){tprint('');all.forEach(function(x){tprint('  '+pad(x.c,48)+x.d,'c-hint');});tprint('');}return;}
      if(matches.length===1){inp.value=matches[0].c+' ';hideAC();}
      else if(matches.length>1){var pfx=cpfx(matches.map(function(m){return m.c;}));if(pfx.length>inp.value.length)inp.value=pfx;renderAC(matches);if(matches.length<=8){tprint('');matches.forEach(function(x){tprint('  '+pad(x.c,48)+x.d,'c-hint');});tprint('');}}
      else tprint('% Unrecognized command','c-err');
    } else if(e.key==='ArrowUp'){e.preventDefault();if(acV&&matches.length){acIdx=Math.max(0,acIdx-1);renderAC(matches);}else{var h=devHists[curDev]||[];if(histIdx<h.length){inp.value=h[histIdx];histIdx++;}}}
    else if(e.key==='ArrowDown'){if(acV&&matches.length){acIdx=Math.min(matches.length-1,acIdx+1);renderAC(matches);}else{histIdx=Math.max(0,histIdx-1);inp.value=(devHists[curDev]||[])[histIdx-1]||'';}}
    else if(e.key==='Enter'){e.preventDefault();submitCmd();}
    else if(e.key==='Escape')hideAC();
  });
  cin.addEventListener('keyup',function(e){if(e.key==='Enter'||e.keyCode===13){e.preventDefault();submitCmd();}});
  document.getElementById('runbtn').addEventListener('click',submitCmd);
  document.getElementById('lockBtn').addEventListener('click',unlock);
  document.getElementById('lockInput').addEventListener('keyup',function(e){if(e.key==='Enter'||e.keyCode===13)unlock();});
  // [추가] 모바일 키보드 대응: 키보드가 열려 보이는 화면이 줄면 앱 높이를 그만큼 맞추고 터미널을 맨 아래로
  if(window.visualViewport){
    var vv=window.visualViewport;
    var _fit=function(){
      var app=document.getElementById('app');
      if(window.innerWidth<900){
        app.style.height=vv.height+'px';                       // 키보드가 가린 만큼 앱 높이 축소
        app.style.transform='translateY('+vv.offsetTop+'px)';  // [FIX] 화면이 위로 밀린(pan) 만큼 되돌려 검은 빈공간 방지
      } else { app.style.height=''; app.style.transform=''; }
    };
    var _fitScroll=function(){ _fit(); scrollTermBottom(); };
    vv.addEventListener('resize',_fitScroll);
    vv.addEventListener('scroll',_fit);                        // pan 시 위치만 보정(터미널 출력 스크롤은 건드리지 않음)
    cin.addEventListener('focus',function(){
      if(window.innerWidth<900){var q=document.getElementById('quickbar'),s=document.getElementById('sarea');if(q)q.style.display='none';if(s)s.style.display='none';}  // [FIX] 키보드 뜨면 보조 줄 숨겨 입력줄 잘림 방지
      setTimeout(_fitScroll,250);
    });
    cin.addEventListener('blur',function(){
      if(window.innerWidth<900){var q=document.getElementById('quickbar'),s=document.getElementById('sarea');if(q)q.style.display='flex';if(s)s.style.display='flex';}  // 키보드 닫히면 복구
      setTimeout(_fit,150);
    });
  } else {
    cin.addEventListener('focus',function(){setTimeout(scrollTermBottom,150);});
  }
});

// ══════════════════════════════════════════════════════════════
// CHECK / SOLUTION / RESET / TABS
// ══════════════════════════════════════════════════════════════
function doCheck(){
  var area=document.getElementById('sarea');area.innerHTML='';
  var checks=CQ.checks;var all=true;
  checks.forEach(function(c){
    var ok=c.ok(SC);if(!ok)all=false;
    var b=document.createElement('span');b.className=ok?'bok':'berr';
    b.textContent=(ok?'✓ ':'✗ ')+c.l;area.appendChild(b);
  });
  if(all){var w=document.createElement('span');w.style.cssText='color:#3fb950;font-weight:700;font-size:12px;margin-left:4px;';w.textContent='완벽합니다! 🎉';area.appendChild(w);}
}

function doSolution(){
  var sols=CQ.solution;
  var devs=Object.keys(sols);
  var show=devs.indexOf(curDev)>=0?curDev:devs[0];
  tprint('─── 모범답안 ('+show+') ───','c-info');
  (sols[show]||[]).forEach(function(l){
    if(l.startsWith('###')) tprint(l,'c-hint');
    else tprint('  '+l,'c-ok');
  });
  tprint('────────────────','c-info');
}

function doReset(){
  CQ.devs.forEach(function(d){devStates[d]={mode:'user'};devHists[d]=[];});
  SC=initSC();
  document.getElementById('tout').innerHTML='';
  document.getElementById('cin').value='';
  document.getElementById('sarea').innerHTML='';
  hideAC();histIdx=0;acIdx=-1;
  curDev=CQ.devs[0];
  document.querySelectorAll('.dt').forEach(function(t){t.classList.remove('on');});
  var el=document.getElementById('dt-'+curDev);if(el)el.classList.add('on');
  updPrompt();
  tprint('Cisco IOS Software Simulation','c-info');
  tprint('Category: '+CQ.cat+' ('+CQ.sub+')','c-info');
  tprint('TIP: "show running-config" 로 pre-configured 항목 확인 후 작업하세요.','c-hint');
  tprint('Tab=자동완성  ↑↓=히스토리  ▶버튼=실행','c-hint');
  tprint('','');
}

function switchDev(name){
  curDev=name;histIdx=0;acIdx=-1;
  document.querySelectorAll('.dt').forEach(function(t){t.classList.remove('on');});
  var el=document.getElementById('dt-'+name);if(el)el.classList.add('on');
  document.getElementById('tout').innerHTML='';
  document.getElementById('cin').value='';
  hideAC();updPrompt();
  tprint('--- Switched to '+name+' ---','c-info');
  if(window.innerWidth<900) showTopTab('terminal');
}

function showTopTab(id){
  if(window.innerWidth>=900){showLeftTab(id==='terminal'?'tasks':id);return;}
  document.querySelectorAll('.topbar-tab').forEach(function(t){t.classList.remove('on');});
  var tt=document.getElementById('ttab-'+id);if(tt)tt.classList.add('on');
  // document.querySelectorAll('.lsection').forEach(function(s){s.classList.remove('on');});  // ← 기존: 인라인 display 미초기화로 토폴로지 탭이 안 보임
  document.querySelectorAll('.lsection').forEach(function(s){s.classList.remove('on');s.style.display='none';});  // [FIX] 인라인 display 초기화
  var ts=document.getElementById('termSection'),dv=document.getElementById('devtabsEl'),bw=document.querySelector('.brow'),sa=document.getElementById('sarea'),qb=document.getElementById('quickbar');
  var _pb=document.getElementById('taskPeekBar'),_pk=document.getElementById('taskPeek');_pb.style.display='none';_pk.style.display='none';_pb.innerHTML='📋 문제 보기 ▾';  // [추가] 탭 전환 시 문제 패널 초기화
  // if(id==='tasks'){document.getElementById('ls-tasks').classList.add('on');ts.style.display='none';dv.style.display='none';bw.style.display='none';sa.style.display='none';qb.style.display='none';}  // ← 기존
  if(id==='tasks'){var _t=document.getElementById('ls-tasks');_t.classList.add('on');_t.style.display='flex';ts.style.display='none';dv.style.display='none';bw.style.display='none';sa.style.display='none';qb.style.display='none';}  // [FIX] 보일 섹션 display:flex 강제
  // else if(id==='topology'){document.getElementById('ls-topology').classList.add('on');ts.style.display='none';dv.style.display='none';bw.style.display='none';sa.style.display='none';qb.style.display='none';}  // ← 기존
  else if(id==='topology'){var _o=document.getElementById('ls-topology');_o.classList.add('on');_o.style.display='flex';ts.style.display='none';dv.style.display='none';bw.style.display='none';sa.style.display='none';qb.style.display='none';}  // [FIX]
  else{ts.style.display='flex';dv.style.display='flex';bw.style.display='flex';sa.style.display='flex';qb.style.display='flex';_pb.style.display='block';setTimeout(function(){document.getElementById('cin').focus();},80);}  // [추가] CLI 탭에서 문제 보기 바 노출
}
function showLeftTab(id){
  document.querySelectorAll('.lt').forEach(function(t){t.classList.remove('on');});
  var el=document.getElementById('lt-'+id);if(el)el.classList.add('on');
  document.querySelectorAll('.lsection').forEach(function(s){s.classList.remove('on');});
  var el2=document.getElementById('ls-'+id);if(el2)el2.classList.add('on');
}

function unlock(){
  if(document.getElementById('lockInput').value.trim()==='9095'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    buildPool();
    newQ();
    if(window.innerWidth<900){
      document.querySelectorAll('.lsection').forEach(function(p){if(!p.classList.contains('on'))p.style.display='none';});
    }
  } else {
    document.getElementById('lockErr').textContent='비밀번호가 틀렸습니다';
    document.getElementById('lockInput').value='';
  }
}
</script>
