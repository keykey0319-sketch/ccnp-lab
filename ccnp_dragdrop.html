<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>CCNP ENCOR 350-401 Drag &amp; Drop</title>
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --sky:#3a86ff; --sky-soft:#cfe3ff;
  --ink:#0b2545; --line:#d7e0ee; --bg:#f3f6fb; --card:#ffffff;
  --ok:#1b9e5a; --ok-bg:#e7f7ee; --bad:#d6455d; --bad-bg:#fdeaee;
  --chip:#eaf2ff; --chip-br:#9cc0ff; --muted:#5b6b85;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;}
.wrap{max-width:920px;margin:0 auto;padding:12px 12px 90px;}
header.app{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;
  padding:14px 16px;box-shadow:0 6px 18px rgba(11,37,69,.18);}
.app-title{font-size:15px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.app-title .sub{font-weight:500;opacity:.8;font-size:12px;}
.topbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.itemlabel{font-size:12px;color:var(--sky-soft);font-weight:600;}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sky);color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;
  box-shadow:0 2px 8px rgba(11,37,69,.05);}
.instr{font-size:13px;color:var(--muted);margin:0 0 10px;}
.hint{font-size:12px;color:var(--sky);background:var(--sky-soft);border-radius:8px;padding:6px 10px;margin:0 0 12px;display:none;}
.hint.show{display:block;}

/* pool */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--chip-br);border-radius:12px;
  background:#f7fbff;min-height:48px;}
.pool .pool-empty{color:var(--muted);font-size:12px;padding:4px;}
.token{display:inline-flex;align-items:center;background:var(--chip);border:1.5px solid var(--chip-br);
  color:var(--navy);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:grab;
  touch-action:none;user-select:none;max-width:100%;white-space:normal;word-break:break-word;}
.token.code-tok{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;}
.token.selected{outline:3px solid var(--sky);outline-offset:1px;background:#dcebff;}
.token.reuse{border-style:double;border-width:3px;}
.reuse-tag{font-size:9px;margin-left:6px;background:var(--sky);color:#fff;border-radius:6px;padding:1px 5px;}

/* code */
pre.code{margin:0;background:#0b2545;color:#e8f0ff;border-radius:12px;padding:12px;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;}
pre.code.exhibit{background:#10243f;color:#bcd3f5;margin-bottom:10px;border:1px solid #234168;}
.exlabel{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 4px;}
pre.code .dropzone{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:22px;
  padding:1px 8px;margin:0 2px;border:1.5px dashed #6f9be8;border-radius:7px;background:rgba(58,134,255,.16);
  color:#fff;vertical-align:middle;cursor:pointer;font-weight:700;}
pre.code .dropzone.filled{border-style:solid;background:#2b67c9;}
pre.code .dropzone .placed{background:transparent;border:none;color:#fff;font-weight:800;padding:0 2px;}
pre.code .dropzone .placed.ok{background:transparent;color:#8affc0;border:none;}
pre.code .dropzone .placed.bad{background:transparent;color:#ff9caa;border:none;}

/* match / order rows */
.rows{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:stretch;gap:8px;}
.row .head{flex:1;background:#f3f7ff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;align-items:center;}
.row .head.short{flex:0 0 96px;justify-content:center;font-weight:700;color:var(--navy);}

/* bucket */
.buckets{display:flex;flex-direction:column;gap:10px;}
.bucket .bhead{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:6px;}
.bucketbox{flex-direction:column;align-items:stretch;gap:6px;padding:8px;}
.slotrow{display:flex;align-items:center;justify-content:center;min-height:42px;border:1.5px dashed var(--chip-br);
  border-radius:9px;background:#fff;padding:5px 8px;}
.slotrow.filled{border-style:solid;border-color:var(--chip-br);background:#f7fbff;}
.slotrow .placed{border:none;background:transparent;cursor:pointer;width:100%;justify-content:center;text-align:center;}
.slotrow .ph{color:var(--muted);font-size:12px;}
.slotrow .placed.ok{color:var(--ok);font-weight:700;}
.slotrow .placed.bad{color:var(--bad);font-weight:700;}

/* generic dropzone (block) */
.dropzone.block{min-height:48px;border:1.5px dashed var(--chip-br);border-radius:10px;background:#f7fbff;
  padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;align-content:flex-start;cursor:pointer;}
.dropzone.block.slot{flex:0 0 150px;}
.dropzone.block .ph{color:var(--muted);font-size:12px;}
.dropzone.over{background:var(--sky-soft);border-color:var(--sky);}
.placed{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--chip-br);
  border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;
  touch-action:none;user-select:none;white-space:normal;word-break:break-word;}
.placed.code-tok{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.placed .x{font-size:11px;color:var(--bad);font-weight:800;}
.placed.ok{border-color:var(--ok);background:var(--ok-bg);}
.placed.bad{border-color:var(--bad);background:var(--bad-bg);}
.zone-ok{outline:2px solid var(--ok);}
.zone-bad{outline:2px solid var(--bad);}

/* ghost */
#ghost{position:fixed;z-index:9999;pointer-events:none;background:#dcebff;border:1.5px solid var(--sky);
  color:var(--navy);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;
  box-shadow:0 8px 20px rgba(11,37,69,.3);display:none;max-width:70vw;white-space:normal;
  transform:translate(-50%,-150%);}

/* controls */
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.btn{flex:1;min-width:92px;border:none;border-radius:11px;padding:11px 10px;font-size:13.5px;font-weight:700;
  cursor:pointer;color:#fff;}
.btn.grade{background:var(--sky);}
.btn.answer{background:var(--navy2);}
.btn.reset{background:#8095b0;}
.btn:active{transform:translateY(1px);}
.result{margin-top:10px;font-size:14px;font-weight:700;display:none;}
.result.show{display:block;}
.result.pass{color:var(--ok);}
.result.fail{color:var(--bad);}

/* mode + exam */
.modebar{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
.seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;}
.segbtn{border:none;background:transparent;color:#dce8ff;font-weight:700;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;}
.segbtn.active{background:#fff;color:var(--navy);}
.optbtn{border:none;background:rgba(255,255,255,.15);color:#fff;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:9px;cursor:pointer;}
.exambar{display:none;align-items:center;gap:10px;margin-top:10px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;}
.exambar.show{display:flex;}
.exambar #examInfo{font-size:12.5px;color:#eaf2ff;font-weight:600;flex:1;}
.examtimer{font-variant-numeric:tabular-nums;font-weight:800;color:#fff;font-size:14px;background:rgba(0,0,0,.2);padding:4px 9px;border-radius:8px;}
.examsubmit{border:none;background:var(--sky);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(11,37,69,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:18px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:84vh;overflow:auto;}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--navy);}
.modal .big{font-size:34px;font-weight:800;margin:8px 0;}
.modal .big.pass{color:var(--ok);} .modal .big.fail{color:var(--bad);}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
.wronglist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px;}
.wrongchip{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;}
.modal .mbtns{display:flex;gap:8px;}
.modal .mbtn{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;color:#fff;}
.mbtn.review{background:var(--navy2);} .mbtn.restart{background:var(--sky);}

/* nav */
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:8px 10px;display:flex;gap:8px;align-items:center;box-shadow:0 -4px 14px rgba(11,37,69,.08);z-index:50;}
.navbar .wrapn{max-width:920px;margin:0 auto;display:flex;gap:8px;align-items:center;width:100%;}
.navbtn{border:none;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;font-size:15px;cursor:pointer;}
.navbtn:disabled{opacity:.4;}
.progress{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;}
select.jump{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;background:#fff;color:var(--navy);font-weight:600;}
@media(max-width:560px){
  body{font-size:16px;}
  .wrap{padding:10px 10px 94px;}
  .instr{font-size:14px;}
  pre.code{font-size:12.5px;line-height:1.85;padding:12px 10px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;overflow-x:hidden;}
  pre.code .dropzone{min-width:54px;min-height:26px;padding:2px 8px;}
  .token,.placed{font-size:14px;}
  .match-row{flex-direction:column-reverse;gap:6px;}
  .match-row .dropzone.block.slot{flex:1 1 auto;width:100%;}
  .match-row .head{width:100%;}
  .order-row .head.short{flex:0 0 80px;}
  .dropzone.block.slot{flex:0 0 120px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="app-title">CCNP ENCOR 350-401 <span class="sub">Drag &amp; Drop · 61문제</span></div>
    <div class="topbar">
      <span class="itemlabel" id="itemlabel"></span>
      <span class="badge" id="typebadge"></span>
    </div>
    <div class="modebar">
      <div class="seg">
        <button id="mPractice" class="segbtn active">연습</button>
        <button id="mExam" class="segbtn">시험</button>
      </div>
      <button id="orderToggle" class="optbtn">순서: 기출</button>
    </div>
    <div class="exambar" id="exambar">
      <span id="examInfo">시험 모드</span>
      <span class="examtimer" id="examTimer">00:00</span>
      <button class="examsubmit" id="examSubmit">제출하기</button>
    </div>
  </header>

  <div class="card">
    <p class="instr" id="instr"></p>
    <div class="hint" id="hint">선택됨 — 빈칸을 탭하면 들어갑니다. (다시 탭하면 해제)</div>
    <div id="stage"></div>
    <div class="controls">
      <button class="btn grade" id="btnGrade">채점</button>
      <button class="btn answer" id="btnAnswer">정답 보기</button>
      <button class="btn reset" id="btnReset">초기화</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</div>

<div id="ghost"></div>

<div class="overlay" id="examOverlay">
  <div class="modal">
    <h2 id="examResTitle">시험 결과</h2>
    <div class="big" id="examScore"></div>
    <div class="sub" id="examSub"></div>
    <div class="wronglist" id="wrongList"></div>
    <div class="mbtns">
      <button class="mbtn review" id="btnReview">결과 검토</button>
      <button class="mbtn restart" id="btnRestart">새 시험</button>
    </div>
  </div>
</div>

<nav class="navbar">
  <div class="wrapn">
    <button class="navbtn" id="prev">‹</button>
    <select class="jump" id="jump"></select>
    <span class="progress" id="progress"></span>
    <button class="navbtn" id="next">›</button>
  </div>
</nav>

<script>
const QUESTIONS = [

/* ===== normalize ===== */
QUESTIONS.forEach(function(q){
  q._reuse = new Set(q.reuse || []);
  if(q.type==='code'){
    q.dropzones = q.zones.map(function(z){ return {correct:[z.c], multi:false, head:null}; });
  } else {
    q.dropzones = q.targets.map(function(t){
      var cs = Array.isArray(t.c) ? t.c.slice() : [t.c];
      var isB = (q.type==='bucket');
      return {correct:cs, multi:isB, cap:(isB?cs.length:1), head:t.head};
    });
  }
});

/* ===== state ===== */
var order = QUESTIONS.map(function(_,i){return i;}); // presentation order (positions -> question index)
var curPos = 0;
var cur = order[curPos];
var randomOrder = false;
var examMode = false;
var examSubmitted = false;
var examStart = 0, examTimerId = null;
var states = QUESTIONS.map(function(q){
  return { placements: q.dropzones.map(function(){return [];}), selection:null, graded:false, revealed:false, poolOrder:null };
});
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* count how many times a text is currently placed across all zones */
function placedCount(st, text){
  var n=0; st.placements.forEach(function(arr){ arr.forEach(function(t){ if(t===text) n++; }); }); return n;
}
/* pool tokens to show (deduped, shuffled per-visit) */
function poolTokens(q, st){
  if(!st.poolOrder) st.poolOrder = shuffle(q.pool.map(function(_,i){return i;}));
  var out=[];
  st.poolOrder.forEach(function(idx){
    var text = q.pool[idx];
    if(out.some(function(o){return o.text===text;})) return; // unique by text
    var reuse = q._reuse.has(text);
    if(reuse || placedCount(st, text)===0){ out.push({text:text, tid:idx, reuse:reuse}); }
  });
  return out;
}
function tidOf(q, text){ return q.pool.indexOf(text); }

/* ===== render ===== */
var stage = document.getElementById('stage');
var BADGE = {code:'코드 채우기', match:'매칭', order:'순서', bucket:'분류'};

function render(){
  var q = QUESTIONS[cur], st = states[cur];
  document.getElementById('itemlabel').textContent = q.item;
  document.getElementById('typebadge').textContent = BADGE[q.type] || q.type;
  document.getElementById('instr').textContent = q.instr || '';
  document.getElementById('hint').className = 'hint' + (st.selection!=null ? ' show' : '');
  var isCode = (q.type==='code');

  var html = '';
  if(isCode){
    if(q.exhibit){
      html += '<div class="exlabel">Exhibit — response</div>';
      html += '<pre class="code exhibit">' + esc(q.exhibit) + '</pre>';
    }
    html += '<pre class="code">';
    q.code.forEach(function(line, li){
      var parts = line.split(/(\{\d+\})/);
      var rowHtml = '';
      parts.forEach(function(part){
        var m = part.match(/^\{(\d+)\}$/);
        if(m){ rowHtml += zoneInlineHtml(q, st, +m[1]); }
        else { rowHtml += esc(part); }
      });
      html += rowHtml + (li < q.code.length-1 ? '\n' : '');
    });
    html += '</pre>';
    html += poolHtml(q, st, true);
  } else if(q.type==='match'){
    html += '<div class="rows">';
    q.dropzones.forEach(function(dz, i){
      html += '<div class="row match-row">' + zoneBlockHtml(q, st, i, 'slot') +
              '<div class="head">' + esc(dz.head) + '</div></div>';
    });
    html += '</div>';
    html += poolHtml(q, st, false);
  } else if(q.type==='order'){
    html += '<div class="rows">';
    q.dropzones.forEach(function(dz, i){
      html += '<div class="row order-row"><div class="head short">' + esc(dz.head) + '</div>' +
              zoneBlockHtml(q, st, i, '') + '</div>';
    });
    html += '</div>';
    html += poolHtml(q, st, false);
  } else { /* bucket */
    html += '<div class="buckets">';
    q.dropzones.forEach(function(dz, i){
      html += '<div class="bucket"><div class="bhead">' + esc(dz.head) + '</div>' +
              bucketZoneHtml(q, st, i) + '</div>';
    });
    html += '</div>';
    html += poolHtml(q, st, false);
  }
  stage.innerHTML = html;

  // result line
  var res = document.getElementById('result');
  if(examMode && !examSubmitted){
    res.className = 'result'; // no per-question feedback during exam
  } else if(st.graded && !st.revealed){
    var sc = scoreOf(q, st);
    res.textContent = '맞은 칸 ' + sc.right + ' / ' + sc.total + (sc.right===sc.total ? '  ✓ 정답!' : '');
    res.className = 'result show ' + (sc.right===sc.total ? 'pass':'fail');
  } else if(st.revealed){
    res.textContent = '정답이 채워졌습니다.';
    res.className = 'result show pass';
  } else {
    res.className = 'result';
  }

  // controls visibility (hide grade/answer while taking an exam)
  var hideGrade = examMode && !examSubmitted;
  document.getElementById('btnGrade').style.display  = hideGrade ? 'none' : '';
  document.getElementById('btnAnswer').style.display = hideGrade ? 'none' : '';

  // nav (position-based)
  document.getElementById('progress').textContent = (curPos+1) + ' / ' + order.length;
  document.getElementById('prev').disabled = (curPos===0);
  document.getElementById('next').disabled = (curPos===order.length-1);
  document.getElementById('jump').value = String(curPos);
  if(typeof refreshExamInfo==='function') refreshExamInfo();
}

function classifyZone(q, st, i){
  // returns '', 'zone-ok', 'zone-bad' for grading display
  if(!st.graded && !st.revealed) return '';
  return zoneCorrect(q, st, i) ? 'zone-ok' : 'zone-bad';
}
function chipState(q, st, i, text){
  if(!st.graded) return '';
  var correct = q.dropzones[i].correct;
  return correct.indexOf(text)>=0 ? 'ok' : 'bad';
}

function zoneInlineHtml(q, st, i){
  var arr = st.placements[i];
  var cls = 'dropzone' + (arr.length? ' filled':'') ;
  var inner;
  if(arr.length){
    inner = arr.map(function(t){
      return '<span class="placed code-tok '+chipState(q,st,i,t)+'" data-zone="'+i+'" data-tid="'+tidOf(q,t)+'">'+esc(t)+'</span>';
    }).join(' ');
  } else { inner = '____'; }
  return '<span class="'+cls+' '+classifyZone(q,st,i)+'" data-zone="'+i+'">'+inner+'</span>';
}

function zoneBlockHtml(q, st, i, extra){
  var arr = st.placements[i];
  var inner;
  if(arr.length){
    inner = arr.map(function(t){
      return '<span class="placed '+chipState(q,st,i,t)+'" data-zone="'+i+'" data-tid="'+tidOf(q,t)+'">'+esc(t)+'<span class="x">✕</span></span>';
    }).join('');
  } else { inner = '<span class="ph">여기에 놓기</span>'; }
  return '<div class="dropzone block '+(extra||'')+' '+classifyZone(q,st,i)+'" data-zone="'+i+'">'+inner+'</div>';
}

/* bucket category rendered as a fixed number of single-item slot rows (matches PDF) */
function bucketZoneHtml(q, st, i){
  var dz = q.dropzones[i], arr = st.placements[i], cap = dz.cap || arr.length || 1;
  var rows = '';
  for(var r=0; r<cap; r++){
    if(r < arr.length){
      var t = arr[r];
      rows += '<div class="slotrow filled"><span class="placed '+chipState(q,st,i,t)+'" data-zone="'+i+'" data-tid="'+tidOf(q,t)+'">'+esc(t)+'<span class="x">✕</span></span></div>';
    } else {
      rows += '<div class="slotrow"><span class="ph">여기에 놓기</span></div>';
    }
  }
  return '<div class="dropzone block bucketbox '+classifyZone(q,st,i)+'" data-zone="'+i+'">'+rows+'</div>';
}

function poolHtml(q, st, isCode){
  var toks = poolTokens(q, st);
  var inner;
  if(toks.length===0){ inner = '<span class="pool-empty">모든 항목 배치됨</span>'; }
  else{
    inner = toks.map(function(o){
      var c = 'token' + (isCode?' code-tok':'') + (o.reuse?' reuse':'') + (st.selection===o.text?' selected':'');
      var tag = o.reuse ? '<span class="reuse-tag">재사용</span>' : '';
      return '<span class="'+c+'" data-tid="'+o.tid+'" data-pool="1">'+esc(o.text)+tag+'</span>';
    }).join('');
  }
  return '<div style="margin-top:12px"><div class="pool">'+inner+'</div></div>';
}

/* ===== scoring ===== */
function sameSet(a, b){
  if(a.length!==b.length) return false;
  var sa = a.slice().sort(), sb = b.slice().sort();
  for(var i=0;i<sa.length;i++) if(sa[i]!==sb[i]) return false;
  return true;
}
function zoneCorrect(q, st, i){
  return sameSet(st.placements[i], q.dropzones[i].correct);
}
function scoreOf(q, st){
  var right=0; q.dropzones.forEach(function(_,i){ if(zoneCorrect(q,st,i)) right++; });
  return {right:right, total:q.dropzones.length};
}

/* ===== mutations ===== */
function place(zoneIndex, text, from){
  var q = QUESTIONS[cur], st = states[cur];
  if(st.graded || st.revealed){ st.graded=false; st.revealed=false; } // editing clears grade
  var dz = q.dropzones[zoneIndex];
  var tgt = st.placements[zoneIndex];

  if(dz.multi){
    if(tgt.indexOf(text)>=0){ st.selection=null; return; }      // already in this box
    var cap = dz.cap || Infinity;
    if(tgt.length >= cap){ st.selection=null; return; }          // all slots full -> reject (remove one first)
    if(typeof from==='number'){ var s=st.placements[from], k=s.indexOf(text); if(k>=0) s.splice(k,1); }
    tgt.push(text);
  } else {
    if(typeof from==='number'){
      if(from===zoneIndex){ st.selection=null; return; }
      var s2=st.placements[from], k2=s2.indexOf(text); if(k2>=0) s2.splice(k2,1);
    }
    st.placements[zoneIndex] = [text]; // single-cap: replace; occupant returns to pool
  }
  st.selection=null;
}
function removeFromZone(zoneIndex, text){
  var st = states[cur];
  if(st.graded || st.revealed){ st.graded=false; st.revealed=false; }
  var arr = st.placements[zoneIndex], k = arr.indexOf(text);
  if(k>=0) arr.splice(k,1);
}

/* ===== unified pointer interaction (drag + tap), no click handler =====
   Uses setPointerCapture so move/up fire reliably on touch (iOS/Android). */
var ghost = document.getElementById('ghost');
var drag = null;

function clearOver(){ var p=document.querySelector('.dropzone.over'); if(p) p.classList.remove('over'); }

stage.addEventListener('pointerdown', function(e){
  if(e.button && e.button!==0) return;
  var tokEl = e.target.closest('.token, .placed');
  var zoneEl = e.target.closest('.dropzone');
  if(tokEl){
    var q = QUESTIONS[cur];
    drag = { kind:'tok', el:tokEl, pid:e.pointerId,
             text:q.pool[+tokEl.dataset.tid],
             from: tokEl.classList.contains('placed') ? (+tokEl.dataset.zone) : 'pool',
             x:e.clientX, y:e.clientY, lastX:e.clientX, lastY:e.clientY, moved:false };
    try{ tokEl.setPointerCapture(e.pointerId); }catch(_){}
  } else if(zoneEl){
    drag = { kind:'zone', el:null, pid:e.pointerId, zone:+zoneEl.dataset.zone,
             x:e.clientX, y:e.clientY, moved:false };
  } else {
    drag = null;
  }
});

stage.addEventListener('pointermove', function(e){
  if(!drag || drag.pid!==e.pointerId) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y, far=(dx*dx+dy*dy)>49;
  if(drag.kind==='tok'){
    if(!drag.moved && far){ drag.moved=true; ghost.textContent=drag.text; ghost.style.display='block'; }
    if(drag.moved){
      e.preventDefault();
      drag.lastX=e.clientX; drag.lastY=e.clientY;
      ghost.style.left=e.clientX+'px';
      ghost.style.top =e.clientY+'px';
      clearOver();
      var under=document.elementFromPoint(e.clientX,e.clientY);
      var z=under&&under.closest?under.closest('.dropzone'):null;
      if(z) z.classList.add('over');
    }
  } else if(drag.kind==='zone'){
    if(far) drag.moved=true; // moved off -> treat as scroll, not a tap
  }
});

function finishPointer(e){
  if(!drag || drag.pid!==e.pointerId) return;
  var d=drag; drag=null;
  clearOver(); ghost.style.display='none';
  if(d.el){ try{ d.el.releasePointerCapture(e.pointerId); }catch(_){} }
  if(e.type==='pointercancel') return;
  var st=states[cur];

  if(d.kind==='tok'){
    if(!d.moved){
      // tap on a token (select) or a placed chip (remove)
      if(d.from==='pool'){ st.selection=(st.selection===d.text)?null:d.text; }
      else { removeFromZone(d.from, d.text); }
      render(); return;
    }
    // real drag -> drop (use last tracked coords; touch pointerup coords can be unreliable)
    var ux = (d.lastX!=null?d.lastX:e.clientX), uy = (d.lastY!=null?d.lastY:e.clientY);
    var under=document.elementFromPoint(ux,uy);
    var z=under&&under.closest?under.closest('.dropzone'):null;
    if(z){ place(+z.dataset.zone, d.text, d.from); }
    else {
      var pa=under&&under.closest?under.closest('.pool'):null;
      if(pa && typeof d.from==='number') removeFromZone(d.from, d.text);
    }
    render(); return;
  }

  if(d.kind==='zone'){
    if(d.moved) return; // it was a scroll gesture
    if(st.selection!=null){ place(d.zone, st.selection, 'pool'); render(); }
    return;
  }
}
stage.addEventListener('pointerup', finishPointer);
stage.addEventListener('pointercancel', finishPointer);

/* ===== nav (position-based) ===== */
var jump = document.getElementById('jump');
function buildJump(){
  jump.innerHTML='';
  order.forEach(function(qi, pos){
    var q = QUESTIONS[qi];
    var o = document.createElement('option');
    o.value = String(pos);
    o.textContent = (pos+1) + '. ' + q.label + ' · ' + (BADGE[q.type]||q.type);
    jump.appendChild(o);
  });
  jump.value = String(curPos);
}
function go(pos){
  curPos = Math.max(0, Math.min(order.length-1, pos));
  cur = order[curPos];
  states[cur].poolOrder = null;   // reshuffle the draggable options on each visit
  window.scrollTo(0,0);
  render();
}
document.getElementById('prev').addEventListener('click', function(){ go(curPos-1); });
document.getElementById('next').addEventListener('click', function(){ go(curPos+1); });
jump.addEventListener('change', function(){ go(+jump.value); });

/* ===== question order toggle ===== */
function applyOrder(rand){
  randomOrder = rand;
  order = rand ? shuffle(QUESTIONS.map(function(_,i){return i;})) : QUESTIONS.map(function(_,i){return i;});
  curPos = 0; cur = order[0];
  states[cur].poolOrder = null;
  document.getElementById('orderToggle').textContent = '순서: ' + (rand ? '랜덤' : '기출');
  buildJump();
}
document.getElementById('orderToggle').addEventListener('click', function(){
  if(examMode) return; // order is managed by exam mode
  applyOrder(!randomOrder);
  render();
});

/* ===== exam mode ===== */
var exambar = document.getElementById('exambar');
function fmt(t){ var m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function tickTimer(){
  var el = Math.floor((Date.now()-examStart)/1000);
  document.getElementById('examTimer').textContent = fmt(el);
}
function answeredCount(){
  var n=0; states.forEach(function(st){ if(st.placements.some(function(a){return a.length;})) n++; }); return n;
}
function refreshExamInfo(){
  if(examMode && !examSubmitted){
    document.getElementById('examInfo').textContent = '시험 진행 중 · 입력한 문제 ' + answeredCount() + ' / ' + QUESTIONS.length;
  }
}
function resetAll(){
  states.forEach(function(st, qi){
    st.placements = QUESTIONS[qi].dropzones.map(function(){return [];});
    st.graded=false; st.revealed=false; st.selection=null; st.poolOrder=null;
  });
}
function setMode(exam){
  examMode = exam; examSubmitted = false;
  document.getElementById('mPractice').classList.toggle('active', !exam);
  document.getElementById('mExam').classList.toggle('active', exam);
  exambar.className = 'exambar' + (exam ? ' show' : '');
  document.getElementById('orderToggle').style.opacity = exam ? '.5' : '1';
  if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  if(exam){
    resetAll();
    order = shuffle(QUESTIONS.map(function(_,i){return i;}));  // exam always shuffles
    curPos=0; cur=order[0];
    document.getElementById('examSubmit').textContent = '제출하기';
    examStart = Date.now(); tickTimer(); examTimerId = setInterval(tickTimer, 1000);
    buildJump(); refreshExamInfo();
  } else {
    applyOrder(randomOrder); // back to chosen practice order
  }
  render();
}
document.getElementById('mPractice').addEventListener('click', function(){ if(examMode) setMode(false); });
document.getElementById('mExam').addEventListener('click', function(){ if(!examMode) setMode(true); });

function questionFullyCorrect(qi){
  var q=QUESTIONS[qi], st=states[qi];
  return q.dropzones.every(function(_,i){ return zoneCorrect(q, st, i); });
}
function submitExam(){
  if(examSubmitted){ // already graded -> button acts as "show result again"
    document.getElementById('examOverlay').classList.add('show'); return;
  }
  examSubmitted = true;
  if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  states.forEach(function(st){ st.graded=true; });
  var right=0, wrong=[];
  order.forEach(function(qi, pos){
    if(questionFullyCorrect(qi)) right++; else wrong.push({pos:pos, label:QUESTIONS[qi].label});
  });
  var total=QUESTIONS.length, pct=Math.round(right/total*100);
  var el=Math.floor((Date.now()-examStart)/1000);
  document.getElementById('examScore').textContent = right + ' / ' + total + '  (' + pct + '%)';
  document.getElementById('examScore').className = 'big ' + (pct>=80 ? 'pass':'fail');
  document.getElementById('examSub').textContent = '소요 시간 ' + fmt(el) + ' · ' + (pct>=80 ? '합격 기준(80%) 통과' : '합격 기준 80% 미만');
  var wl=document.getElementById('wrongList'); wl.innerHTML='';
  if(wrong.length===0){ wl.innerHTML='<span class="sub">모두 정답입니다 🎉</span>'; }
  else{
    wrong.forEach(function(w){
      var c=document.createElement('span'); c.className='wrongchip';
      c.textContent=w.label; c.title='이 문제로 이동';
      c.addEventListener('click', function(){ document.getElementById('examOverlay').classList.remove('show'); go(w.pos); });
      wl.appendChild(c);
    });
  }
  document.getElementById('examInfo').textContent = '시험 종료 · 검토 모드';
  document.getElementById('examSubmit').textContent = '결과 다시 보기';
  document.getElementById('examOverlay').classList.add('show');
  render();
}
document.getElementById('examSubmit').addEventListener('click', submitExam);
document.getElementById('btnReview').addEventListener('click', function(){
  document.getElementById('examOverlay').classList.remove('show');
});
document.getElementById('btnRestart').addEventListener('click', function(){
  document.getElementById('examOverlay').classList.remove('show');
  setMode(true);
});

/* ===== init ===== */
buildJump();
render();
</script>
</body>
</html>
