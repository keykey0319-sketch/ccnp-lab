<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>300-420 ENSLD 드래그앤드롭 연습</title>
<style>
  :root{
    --navy:#0b2545;
    --navy2:#123a6b;
    --sky:#4fb3e8;
    --sky-light:#e8f5fd;
    --sky-mid:#bfe4f7;
    --amber:#f5a623;
    --green:#2ecc71;
    --red:#e74c3c;
    --gray:#8a97a8;
    --bg:#f4f8fb;
    --card:#ffffff;
    --pool-bg:#cdeaf9;
    --pool-border:#79c2ea;
    --pool-text:#0e3050;
    --tan-bg:#ffe6b0;
    --tan-header:#e8963c;
    --tan-header-text:#3a2200;
    --tan-border:#dba05a;
    --tan-text:#4a2a00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; color:#1c2b3a; overscroll-behavior:none; overflow-x:hidden; width:100%; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;}
  #app{max-width:960px; margin:0 auto; padding:6px 8px 78px; width:100%;}
  header{position:sticky; top:0; z-index:50; background:var(--navy); color:#fff; padding:7px 10px; border-radius:0 0 10px 10px; box-shadow:0 2px 10px rgba(0,0,0,.15);}
  header h1{font-size:12.5px; margin:0 0 3px; font-weight:700; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .top-row{display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--sky-mid);}
  .progress-wrap{background:rgba(255,255,255,.15); border-radius:8px; height:4px; margin-top:4px; overflow:hidden;}
  .progress-bar{background:var(--sky); height:100%; width:0%; transition:width .25s;}
  .score-pill{background:rgba(255,255,255,.12); padding:2px 8px; border-radius:20px; font-weight:600;}

  main{margin-top:6px;}
  .qmeta{font-size:10.5px; color:var(--gray); margin-bottom:2px; font-weight:600;}
  .instr{background:var(--card); border-left:3px solid var(--sky); padding:7px 9px; border-radius:6px; font-size:11.5px; line-height:1.35; margin-bottom:6px; box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .instr b{color:var(--navy2);}

  /* ---- 옵션바 (모드/순서/전체정답) - 한 줄로 압축, 넘치면 가로 스크롤 ---- */
  .opt-bar{display:flex; flex-wrap:nowrap; gap:6px; align-items:center; margin-bottom:6px; background:var(--card); border-radius:8px; padding:5px 6px; box-shadow:0 1px 4px rgba(0,0,0,.05); overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .opt-group{display:flex; background:#eef2f6; border-radius:7px; padding:2px; gap:2px; flex-shrink:0;}
  .opt-btn{border:none; background:transparent; padding:5px 8px; font-size:10.5px; font-weight:700; border-radius:5px; color:#5a6a7c; cursor:pointer; white-space:nowrap;}
  .opt-btn.active{background:var(--sky); color:#fff;}
  .opt-btn-all{background:var(--navy2); color:#fff; border:none; border-radius:7px; padding:6px 10px; font-size:10.5px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; margin-left:auto;}

  /* ---- Select-and-Place 스타일 2단 레이아웃 ---- */
  .quiz-grid{display:flex; gap:8px; align-items:flex-start;}
  .pool-col{flex:1; min-width:0;}
  .zones-col{flex:1; min-width:0;}
  .col-label{font-size:10px; font-weight:700; color:var(--gray); margin-bottom:3px; padding-left:2px;}

  .pool{display:flex; flex-direction:column; gap:5px; padding:0; background:transparent; border-radius:0; min-height:16px; box-shadow:none;}
  .pool.empty::after{content:"모두 배치됨"; color:var(--gray); font-size:11.5px; padding:4px; display:block; text-align:center;}

  .chip{
    background:var(--pool-bg); border:2px solid var(--pool-border); color:var(--pool-text);
    padding:7px 8px; border-radius:6px; font-size:11.5px; line-height:1.25;
    cursor:grab; user-select:none; touch-action:none; font-weight:500;
    width:100%; box-shadow:0 1px 2px rgba(0,0,0,.06);
    transition:transform .1s, box-shadow .1s;
    display:flex; align-items:center; justify-content:center; text-align:center; min-height:34px;
    -webkit-user-drag:none;
  }
  .chip.selected{ border-color:var(--amber); background:#fff4e0; box-shadow:0 0 0 3px rgba(245,166,35,.25); }
  .chip.dragging{ opacity:.35; }
  .ghost-chip{
    position:fixed; z-index:999; pointer-events:none; background:var(--sky); color:#fff;
    padding:8px 11px; border-radius:9px; font-size:12px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.25);
    transform:translate(-50%,-120%); max-width:220px;
  }

  .zones{display:flex; flex-direction:column; gap:6px;}
  .zone{background:var(--tan-bg); border:2px solid var(--tan-border); border-radius:7px; overflow:hidden;}
  .zone-head{background:var(--tan-header); color:var(--tan-header-text); font-size:11px; font-weight:800; padding:5px 9px;}
  .zone-body{padding:0; display:flex; flex-direction:column;}
  .slot{
    min-height:34px; border:none; border-bottom:1px solid rgba(150,100,30,.22); border-radius:0;
    display:flex; align-items:center; justify-content:center;
    padding:5px 8px; background:transparent; transition:background .15s;
  }
  .slot:last-child{border-bottom:none;}
  .slot.hover{background:rgba(255,255,255,.55);}
  .slot .chip{width:100%; cursor:grab; background:transparent; border:none; box-shadow:none; color:var(--tan-text); min-height:0; padding:2px;}
  .slot.correct{background:#cdf3d8;}
  .slot.incorrect{background:#fbcfcb;}
  .slot-empty-label{color:rgba(90,60,10,.5); font-size:10.5px; font-weight:600;}

  /* ---- zone 안에 고정 라벨이 있는 행(rows) ---- */
  .zone-row{border-bottom:1px solid rgba(150,100,30,.3);}
  .zone-row:last-child{border-bottom:none;}
  .row-label{font-size:12.5px; font-weight:500; color:var(--tan-text); opacity:.6; padding:5px 8px 0; text-transform:none;}
  .zone-row .slot{border-bottom:none; min-height:26px; padding:2px 8px 6px;}

  .order-num{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%;
    background:var(--navy2); color:#fff; font-size:10px; font-weight:700; margin-right:6px; flex-shrink:0;
  }

  @media (max-width:640px){
    .quiz-grid{flex-direction:column; align-items:stretch;}
    .pool-col, .zones-col{width:100%;}
  }

  .controls{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e2e8f0;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:60;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .controls .wrap{max-width:960px; margin:0 auto; display:flex; flex-wrap:nowrap; gap:5px; width:100%;}
  button{
    border:none; border-radius:8px; padding:9px 2px; font-size:10.5px; font-weight:700; cursor:pointer;
    flex:1 1 0; min-width:0; transition:transform .08s, opacity .15s;
  }
  button:active{transform:scale(.96);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-nav{background:#eef2f6; color:var(--navy2);}
  .btn-check{background:var(--sky); color:#fff;}
  .btn-reveal{background:var(--amber); color:#fff;}
  .btn-reveal-all{background:var(--navy2); color:#fff;}
  .btn-reset{background:#eef2f6; color:var(--red);}

  .feedback{margin-top:5px; padding:6px 9px; border-radius:7px; font-size:11.5px; font-weight:700; text-align:center;}
  .feedback.ok{background:#eafaf0; color:#1c8a4c;}
  .feedback.bad{background:#fdecea; color:#c0392b;}
  .feedback.info{background:#fff4e0; color:#8a5a00;}

  .summary{background:var(--card); border-radius:12px; padding:18px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .summary h2{color:var(--navy2); margin-top:0;}
  .summary .big{font-size:40px; font-weight:800; color:var(--sky);}
  .qchips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px;}
  .qchip{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; cursor:pointer; color:#fff;}
  .qchip.correct{background:var(--green);}
  .qchip.incorrect{background:var(--red);}
  .qchip.unanswered{background:var(--gray);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📡 300-420 ENSLD Drag &amp; Drop 연습</h1>
    <div class="top-row">
      <span id="qCounter">문제 1 / 16</span>
      <span class="score-pill" id="scorePill">0 / 0</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <main id="main"></main>
</div>

<div class="controls">
  <div class="wrap">
    <button class="btn-nav" id="btnPrev">◀ 이전</button>
    <button class="btn-check" id="btnCheck">채점</button>
    <button class="btn-reveal" id="btnReveal">정답보기</button>
    <button class="btn-reset" id="btnReset">초기화</button>
    <button class="btn-nav" id="btnNext">다음 ▶</button>
  </div>
</div>

<script>
/* ============================================================
   PRESERVATION NOTE: This is a new standalone file. No prior
   source is being modified here, so no comment-out rule applies.
   Data source: DnD_300-420.pdf (SPOTO 300-420 ENSLD dump, 16 D&D items).
   ============================================================ */

const QUESTIONS = [
// -------- Q1 --------
{ n:1, title:'YANG Model Characteristics', type:'bucket',
  instr:'Drag and drop the characteristics from the left onto the YANG models they describe on the right. Not all options are used.',
  targets:[
    {id:'ciscoNative', label:'Cisco Native', cap:2},

// -------- Q2 --------
{ n:2, title:'VPN Types', type:'bucket',
  instr:'Drag and drop the descriptions from the left onto the corresponding VPN types on the right.',
  targets:[
    {id:'l2vpn', label:'Layer 2 VPN', cap:3},
    {id:'mplsl3vpn', label:'MPLS Layer 3 VPN', cap:3}

  items:[

    {id:'i2', text:'Sites appear to each other to be directly connected at Layer 3.', target:'l2vpn'},
    {id:'i3', text:'The customer initiates Layer 3 connectivity with the remote sites.', target:'l2vpn'},

  ]
},
// -------- Q3 --------
{ n:3, title:'WAN Connectivity Categories', type:'bucket',
  instr:'Drag and drop the descriptions from the left onto the corresponding WAN connectivity types and categories on the right.',
  targets:[
    {id:'sdwan', label:'CISCO SD-WAN', rows:[
      {id:'sdwan_sec', label:'data security'},
      {id:'sdwan_seg', label:'network segmentation'},
      {id:'sdwan_route', label:'routing exposure'}
    ]},
    {id:'mplsvpn', label:'MPLS VPN', rows:[

// -------- Q5 --------
{ n:5, title:'NETCONF vs RESTCONF', type:'bucket',

  items:[

{ n:6, title:'Cisco SD-WAN Components', type:'match',
  instr:'Drag and drop the descriptions from the left onto the Cisco SD-WAN component they describe on the right.',
  targets:[
    {id:'wanEdge', label:'Cisco WAN Edge router', cap:1},
    {id:'vsmart', label:'Cisco vSmart Controller', cap:1},

  ],
  items:[

    {id:'i2', text:'distributes routes and policy information via OMP', target:'vsmart'},
    {id:'i3', text:'enables centralized provisioning and simplifies network changes', target:'vmanage'},
    {id:'i4', text:'enables the communication of devices that sit behind NAT', target:'vbond'}
  ]
},
// -------- Q7 --------
{ n:7, title:'Model-Driven Telemetry Modes', type:'bucket',
  instr:'Drag and drop the model-driven telemetry considerations from the left onto the modes they apply to on the right.',
  targets:[
    {id:'dialIn', label:'Dial-In Mode', cap:2},
    {id:'dialOut', label:'Dial-Out Mode', cap:2}
  ],
  items:[

    {id:'i3', text:'no need to open ports for inbound management traffic', target:'dialOut'},
    {id:'i4', text:'anycast and load-balancing', target:'dialOut'}
  ]
},
// -------- Q8 --------
{ n:8, title:'SD-Access Architecture', type:'match',
  instr:'Drag and drop the components in a Cisco SD-Access architecture from the left onto their descriptions on the right.',
  targets:[
    {id:'underlay', label:'underlay network', cap:1},
    {id:'overlay', label:'overlay network', cap:1},
    {id:'fabCtrl', label:'fabric control plane', cap:1},
    {id:'fabData', label:'fabric data plane', cap:1}
  ],
  items:[

    {id:'i2', text:'uses VXLAN to overlay a Layer 2 network on top of a Layer 3 network', target:'overlay'},
    {id:'i3', text:'uses LISP to exchange EID-to-RLOC mapping', target:'fabCtrl'},
    {id:'i4', text:'contains data plane traffic and control plane signaling', target:'fabData'}
  ]
},
// -------- Q9 --------
{ n:9, title:'WAN Edge Onboarding Order', type:'order',
  instr:'Drag and drop the steps WAN Edge performs when on-boarded into the Cisco SD-WAN overlay from the left into the order they are completed on the right.',
  targets:[
    {id:'step1', label:'Step 1', cap:1},
    {id:'step2', label:'Step 2', cap:1},
    {id:'step3', label:'Step 3', cap:1},
    {id:'step4', label:'Step 4', cap:1}
  ],
  items:[
    {id:'i1', text:'WAN Edge authenticates to vBond.', target:'step1'},
    {id:'i2', text:'WAN Edge establishes a secure connection to vManage and vSmart.', target:'step2'},
    {id:'i3', text:'WAN Edge establishes an OMP session to vSmart.', target:'step3'},
    {id:'i4', text:'WAN Edge establishes IPsec connections to other TLOC locations.', target:'step4'}
  ]
},
// -------- Q10 --------
{ n:10, title:'WAN Connectivity Use Cases', type:'match',
  instr:'Drag and drop the types of WAN connectivity from the left onto the connectivity use cases on the right.',
  targets:[
    {id:'shortDc', label:'recommended for short-distance data center interconnect', cap:1},
    {id:'longDc', label:'recommended for long-distance data center interconnect', cap:1},

  ],
  items:[

    {id:'i2', text:'DWDM', target:'longDc'},
    {id:'i3', text:'SD-WAN customer edge', target:'connectDc'}

},
// -------- Q11 --------
{ n:11, title:'Metro Ethernet vs SD-WAN', type:'bucket',
  instr:'Drag and drop the descriptions from the left onto the categories they apply to on the right.',
  targets:[
    {id:'metroE', label:'Metro Ethernet', cap:2},
    {id:'sdwan2', label:'SD-WAN', cap:2}
  ],
  items:[
    {id:'i1', text:'bandwidth increased dynamically without installing new equipment', target:'metroE'},
    {id:'i2', text:'same technology that is used in the LAN', target:'metroE'},
    {id:'i3', text:'large-scale IoT and mobile global enterprises deployments', target:'sdwan2'},
    {id:'i4', text:'greater speed, reliability, and efficiency while connecting to cloud platforms', target:'sdwan2'}
  ]
},
// -------- Q12 --------
{ n:12, title:'VLSM Subnetting', type:'match',
  instr:'An engineer must design a subnetting scheme from 10.1.1.0/24 that meets each department\u2019s host requirements. Drag and drop the subnets onto the correct department. Not all subnets are used.',
  targets:[
    {id:'hr', label:'5 hosts for Human Resources', cap:1},
    {id:'facilities', label:'18 hosts for Facilities', cap:1},
    {id:'engineering', label:'32 hosts for Engineering', cap:1},
    {id:'finance', label:'12 hosts for Finance', cap:1}
  ],
  items:[
    {id:'i1', text:'10.1.1.16/27', target:null},
    {id:'i2', text:'10.1.1.96/26', target:null},
    {id:'i3', text:'10.1.1.96/28', target:'finance'},
    {id:'i4', text:'10.1.1.112/29', target:'hr'},
    {id:'i5', text:'10.1.1.8/28', target:null},
    {id:'i6', text:'10.1.1.0/26', target:'engineering'},

},
// -------- Q13 --------
{ n:13, title:'SD-WAN Planes', type:'match',

},
// -------- Q14 --------
{ n:14, title:'Catalyst SD-WAN Components', type:'match',
  instr:'Drag and drop the Cisco Catalyst SD-WAN components from the left to their definitions on the right.',
  targets:[
    {id:'gui', label:'GUI interface used to manage Cisco Catalyst SD-WAN devices', cap:1},
    {id:'omp', label:'uses OMP to distribute routes and policy information to WAN Edge routers', cap:1},

{ n:15, title:'Catalyst SD-WAN Component Functions', type:'match',

  targets:[
    {id:'secure', label:'provides secure data plane connectivity between sites', cap:1},
    {id:'monitor', label:'interface to monitor, configure, and maintain Cisco Catalyst SD-WAN devices', cap:1},
    {id:'reflect', label:'acts as a route reflector to distribute route and policy information', cap:1},
    {id:'onboard', label:'facilitates Cisco Catalyst SD-WAN fabric onboarding', cap:1}
  ],
  items:[
    {id:'i1', text:'vEdge', target:'secure'},
    {id:'i2', text:'vManage', target:'monitor'},
    {id:'i3', text:'vSmart', target:'reflect'},
    {id:'i4', text:'vBond', target:'onboard'}

},
// -------- Q16 --------
{ n:16, title:'YANG Model Use Cases', type:'match',
  instr:'Drag and drop the YANG data models from the left onto the corresponding use cases on the right.',
  targets:[
    {id:'leading', label:'recommended for leading edge feature deployments', cap:1},
    {id:'simple', label:'recommended for less complex and initial automation deployments', cap:1},
    {id:'complex', label:'recommended for complex, reliable deployments', cap:1}
  ],
  items:[

/* ---------------- STATE ---------------- */
// practiceMode: true=연습모드(즉시채점/정답보기 가능), false=시험모드(끝까지 풀고 한번에 채점)
let practiceMode = true;
// orderMode: 'sequential'=출제순, 'random'=랜덤순
let orderMode = 'sequential';
// activeQuestions: 실제로 사용하는 문제 배열(원본 QUESTIONS를 그대로 쓰거나 셔플한 사본)
let activeQuestions = QUESTIONS.slice();
let curIdx = 0;
// placements[qIdx] = { itemId: {targetId, slotIdx} }
let placements = activeQuestions.map(()=>({}));
// status[qIdx] = 'unanswered' | 'correct' | 'incorrect' | 'revealed'
let status = activeQuestions.map(()=> 'unanswered');
let showingSummary = false;

const mainEl = document.getElementById('main');
const qCounter = document.getElementById('qCounter');
const scorePill = document.getElementById('scorePill');
const progressBar = document.getElementById('progressBar');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------------- 모드 / 순서 전환 (문제 화면에서 바로 전환) ---------------- */
function setPracticeMode(val){
  if(val===practiceMode) return;
  practiceMode = val;
  render();
}

function setOrderMode(val){
  if(val===orderMode) return;
  orderMode = val;
  activeQuestions = (orderMode==='random') ? shuffle(QUESTIONS) : QUESTIONS.slice();
  placements = activeQuestions.map(()=>({}));
  status = activeQuestions.map(()=> 'unanswered');
  curIdx = 0;
  showingSummary = false;
  render();
}

/* ---------------- 정답 배치 계산 (rows/구식 cap 구조 모두 지원) ---------------- */
function computeCorrectPlacements(q){
  const newPlaced = {};
  q.targets.forEach(t=>{
    if(t.rows && t.rows.length){
      t.rows.forEach(r=>{
        const it = q.items.find(i=>i.target===r.id);
        if(it) newPlaced[it.id] = {targetId:r.id, slotIdx:0};
      });
    } else {
      let slotCounter = 0;
      q.items.filter(it=>it.target===t.id).forEach(it=>{
        newPlaced[it.id] = {targetId:t.id, slotIdx:slotCounter};
        slotCounter++;
      });
    }
  });
  return newPlaced;
}

/* ---------------- 전체(처음~끝) 정답 표시 ---------------- */
function revealAll(){
  activeQuestions.forEach((q, idx)=>{
    placements[idx] = computeCorrectPlacements(q);
    status[idx] = 'revealed';
  });
  render();
  updateFeedback('info', `💡 전체 ${activeQuestions.length}문제의 정답을 모두 표시했습니다.`);
}

function updateHeader(){
  if(showingSummary){
    qCounter.textContent = '결과 요약';
  } else {
    qCounter.textContent = `문제 ${curIdx+1} / ${activeQuestions.length}`;
  }
  const correctCount = status.filter(s=>s==='correct').length;
  const answered = status.filter(s=>s!=='unanswered').length;
  scorePill.textContent = `${correctCount} / ${activeQuestions.length}`;
  progressBar.style.width = (answered/activeQuestions.length*100)+'%';
}

function poolItemsFor(qIdx){
  const q = activeQuestions[qIdx];
  const placed = placements[qIdx];
  return q.items.filter(it => !placed[it.id]);
}

function render(){
  if(showingSummary){ renderSummary(); updateHeader(); return; }
  const q = activeQuestions[curIdx];
  const placed = placements[curIdx];
  const st = status[curIdx];

  let html = '';
  html += `<div class="opt-bar">
    <div class="opt-group" id="modeGroup">
      <button type="button" class="opt-btn ${practiceMode?'active':''}" data-val="practice">📖 연습모드</button>
      <button type="button" class="opt-btn ${!practiceMode?'active':''}" data-val="exam">📝 시험모드</button>
    </div>
    <div class="opt-group" id="orderGroup">
      <button type="button" class="opt-btn ${orderMode==='sequential'?'active':''}" data-val="sequential">🔢 출제순</button>
      <button type="button" class="opt-btn ${orderMode==='random'?'active':''}" data-val="random">🔀 랜덤순</button>
    </div>
    <button type="button" class="opt-btn-all" id="btnRevealAllTop">💡 전체정답</button>
  </div>`;
  html += `<div class="qmeta">문제 ${q.n} · ${escapeHtml(q.title)}</div>`;
  html += `<div class="instr">${escapeHtml(q.instr)}</div>`;
  html += `<div class="quiz-grid">`;
  html += `<div class="pool-col"><div class="col-label">보기 (드래그해서 오른쪽에 놓으세요)</div><div class="pool" id="pool"></div></div>`;
  html += `<div class="zones-col"><div class="col-label">정답 위치</div><div class="zones">`;
  q.targets.forEach(t=>{
    html += `<div class="zone"><div class="zone-head">${escapeHtml(t.label)}</div><div class="zone-body">`;
    if(t.rows && t.rows.length){
      t.rows.forEach(r=>{
        html += `<div class="zone-row">
          <div class="row-label">${escapeHtml(r.label)}</div>
          <div class="slot" data-target="${r.id}" data-slot="0"><span class="slot-empty-label">&nbsp;</span></div>
        </div>`;
      });
    } else {
      for(let s=0; s<t.cap; s++){
        html += `<div class="slot" data-target="${t.id}" data-slot="${s}"><span class="slot-empty-label">${q.type==='order' ? '' : '&nbsp;'}</span></div>`;
      }
    }
    html += `</div></div>`;
  });
  html += `</div></div>`;
  html += `</div>`;
  html += `<div id="feedbackWrap"></div>`;

  mainEl.innerHTML = html;

  // place chips already assigned
  const poolEl = document.getElementById('pool');
  Object.entries(placed).forEach(([itemId, loc])=>{
    const item = q.items.find(i=>i.id===itemId);
    const slotEl = document.querySelector(`.slot[data-target="${loc.targetId}"][data-slot="${loc.slotIdx}"]`);
    if(slotEl && item){
      slotEl.innerHTML='';
      slotEl.appendChild(makeChip(item));
    }
  });

  // pool chips (unplaced)
  const remaining = poolItemsFor(curIdx);
  remaining.forEach(it=>{
    poolEl.appendChild(makeChip(it));
  });
  if(remaining.length===0) poolEl.classList.add('empty');

  // reapply grading visuals if already graded/revealed
  if(st==='correct' || st==='incorrect'){
    applyGrading(false);
  } else if(st==='revealed'){
    applyGrading(true);
  }

  attachInteractions();
  attachOptBarInteractions();
  updateButtons();
  updateHeader();
}

function attachOptBarInteractions(){
  const modeGroup = document.getElementById('modeGroup');
  if(modeGroup) modeGroup.querySelectorAll('.opt-btn').forEach(b=>{
    b.addEventListener('click', ()=> setPracticeMode(b.dataset.val==='practice'));
  });
  const orderGroup = document.getElementById('orderGroup');
  if(orderGroup) orderGroup.querySelectorAll('.opt-btn').forEach(b=>{
    b.addEventListener('click', ()=> setOrderMode(b.dataset.val));
  });
  const revealAllTopBtn = document.getElementById('btnRevealAllTop');
  if(revealAllTopBtn){
    if(!practiceMode){
      revealAllTopBtn.disabled = true;
      revealAllTopBtn.style.opacity = '.4';
    } else {
      revealAllTopBtn.addEventListener('click', ()=>{
        revealAll();
      });
    }
  }
}

function makeChip(item){
  const el = document.createElement('div');
  el.className='chip';
  el.dataset.itemId = item.id;
  el.textContent = item.text;
  return el;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------------- INTERACTION (tap-select + pointer-drag) ---------------- */
let selectedChip = null; // {itemId, fromTarget, fromSlot} currently tap-selected
let dragState = null;

function attachInteractions(){
  const chips = mainEl.querySelectorAll('.chip');
  chips.forEach(chip=>{
    chip.addEventListener('pointerdown', onChipPointerDown);
  });
  const slots = mainEl.querySelectorAll('.slot');
  slots.forEach(slot=>{
    slot.addEventListener('pointerup', ()=> onSlotTap(slot));
  });
  const pool = document.getElementById('pool');
  if(pool) pool.addEventListener('pointerup', (e)=>{
    if(e.target.id==='pool') onPoolTap();
  });
}

function clearSelection(){
  mainEl.querySelectorAll('.chip.selected').forEach(c=>c.classList.remove('selected'));
  selectedChip = null;
}

function isCurrentLocked(){
  // '정답보기'로 표시된 문제이거나, 시험모드에서 이미 채점(제출)된 문제는 수정 불가
  const st = status[curIdx];
  if(st==='revealed') return true;
  if(!practiceMode && (st==='correct' || st==='incorrect')) return true;
  return false;
}

function onChipPointerDown(e){
  if(isCurrentLocked()) return;
  e.preventDefault();
  const chipEl = e.currentTarget;
  const itemId = chipEl.dataset.itemId;
  const startX = e.clientX, startY = e.clientY;
  let moved = false;
  let ghost = null;

  function onMove(ev){
    ev.preventDefault();
    const dx = ev.clientX-startX, dy = ev.clientY-startY;
    if(!moved && Math.hypot(dx,dy) > 8){
      moved = true;
      chipEl.classList.add('dragging');
      ghost = document.createElement('div');
      ghost.className='ghost-chip';
      ghost.textContent = chipEl.textContent;
      document.body.appendChild(ghost);
    }
    if(moved && ghost){
      ghost.style.left = ev.clientX+'px';
      ghost.style.top = ev.clientY+'px';
      mainEl.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const slot = under && under.closest ? under.closest('.slot') : null;
      if(slot) slot.classList.add('hover');
    }
  }
  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    chipEl.classList.remove('dragging');
    if(ghost) ghost.remove();
    mainEl.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));

    if(moved){
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const slot = under && under.closest ? under.closest('.slot') : null;
      const pool = under && under.closest ? under.closest('#pool') : null;
      if(slot){
        placeItemInSlot(itemId, slot.dataset.target, parseInt(slot.dataset.slot));
      } else if(pool){
        unplaceItem(itemId);
      }
      render();
    } else {
      // tap = select/deselect
      if(selectedChip && selectedChip.itemId===itemId){
        clearSelection();
      } else {
        clearSelection();
        selectedChip = {itemId};
        chipEl.classList.add('selected');
      }
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function onSlotTap(slotEl){
  if(isCurrentLocked()) return;
  if(!selectedChip) {
    // if slot has a chip, tapping it (without drag) is handled by chip's own pointerdown/up (tap->select)
    return;
  }
  const targetId = slotEl.dataset.target;
  const slotIdx = parseInt(slotEl.dataset.slot);
  placeItemInSlot(selectedChip.itemId, targetId, slotIdx);
  clearSelection();
  render();
}

function onPoolTap(){
  if(selectedChip){
    unplaceItem(selectedChip.itemId);
    clearSelection();
    render();
  }
}

function placeItemInSlot(itemId, targetId, slotIdx){
  const placed = placements[curIdx];
  // if slot occupied by another item, swap it back to pool
  const occupied = Object.entries(placed).find(([id,loc])=> loc.targetId===targetId && loc.slotIdx===slotIdx);
  if(occupied) delete placed[occupied[0]];
  placed[itemId] = {targetId, slotIdx};
  if(status[curIdx]!=='unanswered' && status[curIdx]!=='revealed') status[curIdx]='unanswered';
}

function unplaceItem(itemId){
  const placed = placements[curIdx];
  delete placed[itemId];
  if(status[curIdx]!=='unanswered' && status[curIdx]!=='revealed') status[curIdx]='unanswered';
}

/* ---------------- GRADING ---------------- */
function computeCorrectness(qIdx){
  const q = activeQuestions[qIdx];
  const placed = placements[qIdx];
  let allCorrect = true;
  let anyPlaced = Object.keys(placed).length>0;
  q.items.forEach(it=>{
    const loc = placed[it.id];
    if(it.target===null){
      if(loc) allCorrect=false; // distractor should stay unplaced
    } else {
      if(!loc || loc.targetId!==it.target) allCorrect=false;
    }
  });
  if(!anyPlaced) allCorrect=false;
  return allCorrect;
}

function gradeQuestionAt(qIdx){
  status[qIdx] = computeCorrectness(qIdx) ? 'correct' : 'incorrect';
}

function grade(){
  const allCorrect = computeCorrectness(curIdx);
  status[curIdx] = allCorrect ? 'correct' : 'incorrect';
  applyGrading(false);
  updateFeedback(allCorrect ? 'ok' : 'bad', allCorrect ? '✅ 정답입니다!' : '❌ 오답이 있습니다. 빨간 슬롯을 확인하세요.');
  updateHeader();
  updateButtons();
}

function applyGrading(isReveal){
  const q = activeQuestions[curIdx];
  const placed = placements[curIdx];
  document.querySelectorAll('.slot').forEach(slotEl=>{
    slotEl.classList.remove('correct','incorrect');
    const targetId = slotEl.dataset.target;
    const slotIdx = parseInt(slotEl.dataset.slot);
    const entry = Object.entries(placed).find(([id,loc])=> loc.targetId===targetId && loc.slotIdx===slotIdx);
    if(entry){
      const item = q.items.find(i=>i.id===entry[0]);
      if(item.target===targetId) slotEl.classList.add('correct');
      else slotEl.classList.add('incorrect');
    }
  });
}

function reveal(){
  const q = activeQuestions[curIdx];
  placements[curIdx] = computeCorrectPlacements(q);
  status[curIdx] = 'revealed';
  render();
  updateFeedback('info', '💡 정답을 표시했습니다.');
}

function resetQuestion(){
  placements[curIdx] = {};
  status[curIdx] = 'unanswered';
  clearSelection();
  render();
}

function updateFeedback(kind, text){
  const wrap = document.getElementById('feedbackWrap');
  if(!wrap) return;
  wrap.innerHTML = `<div class="feedback ${kind}">${text}</div>`;
}

function updateButtons(){
  document.getElementById('btnPrev').disabled = curIdx===0;

  const nextBtn = document.getElementById('btnNext');
  const isLast = curIdx === activeQuestions.length-1;
  nextBtn.textContent = isLast ? (practiceMode ? '결과보기 ▶' : '제출하기 ▶') : '다음 ▶';

  // 연습모드 전용 버튼: 시험모드에서는 즉시채점/정답보기 관련 버튼을 숨김
  const checkBtn = document.getElementById('btnCheck');
  const revealBtn = document.getElementById('btnReveal');
  [checkBtn, revealBtn].forEach(b=>{
    if(b) b.style.display = practiceMode ? '' : 'none';
  });
}

/* ---------------- NAV ---------------- */
document.getElementById('btnCheck').addEventListener('click', ()=>{
  if(showingSummary) return;
  grade();
});
document.getElementById('btnReveal').addEventListener('click', ()=>{
  if(showingSummary) return;
  reveal();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(showingSummary) return;
  resetQuestion();
});
document.getElementById('btnPrev').addEventListener('click', ()=>{
  if(showingSummary){ showingSummary=false; curIdx=activeQuestions.length-1; render(); return; }
  if(curIdx>0){ curIdx--; render(); }
});
document.getElementById('btnNext').addEventListener('click', ()=>{
  if(showingSummary) return;
  if(curIdx<activeQuestions.length-1){
    curIdx++; render();
  } else {
    // 마지막 문제: 시험모드라면 지금까지 채점되지 않은 문제를 한번에 채점
    if(!practiceMode){
      activeQuestions.forEach((q, idx)=>{
        if(status[idx]!=='revealed') gradeQuestionAt(idx);
      });
    }
    showingSummary=true;
    render();
  }
});

/* ---------------- SUMMARY ---------------- */
function renderSummary(){
  const correctCount = status.filter(s=>s==='correct').length;
  const total = activeQuestions.length;
  let html = `<div class="summary">`;
  html += `<h2>학습 결과</h2>`;
  html += `<div class="big">${correctCount} / ${total}</div>`;
  html += `<div style="color:var(--gray); margin-top:6px; font-size:13px;">정답률 ${Math.round(correctCount/total*100)}%</div>`;
  html += `<div class="qchips">`;
  activeQuestions.forEach((q,idx)=>{
    const st = status[idx];
    const cls = st==='correct' ? 'correct' : (st==='unanswered' ? 'unanswered' : 'incorrect');
    html += `<div class="qchip ${cls}" data-idx="${idx}">${q.n}</div>`;
  });
  html += `</div>`;
  html += `<div style="margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <button class="btn-nav" id="btnRetryWrong" style="flex:none; padding:10px 16px;">틀린 문제만 다시</button>
    <button class="btn-nav" id="btnRestartAll" style="flex:none; padding:10px 16px;">전체 초기화</button>
  </div>`;
  html += `</div>`;
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.qchip').forEach(el=>{
    el.addEventListener('click', ()=>{
      curIdx = parseInt(el.dataset.idx);
      showingSummary=false;
      render();
    });
  });
  const retryBtn = document.getElementById('btnRetryWrong');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{
    const wrongIdx = status.findIndex(s=> s!=='correct');
    if(wrongIdx===-1){
      retryBtn.textContent = '🎉 모두 정답입니다!';
      setTimeout(()=>{ retryBtn.textContent='틀린 문제만 다시'; }, 1800);
      return;
    }
    curIdx = wrongIdx;
    showingSummary=false;
    render();
  });
  const restartBtn = document.getElementById('btnRestartAll');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{
    placements = activeQuestions.map(()=>({}));
    status = activeQuestions.map(()=> 'unanswered');
    curIdx = 0;
    showingSummary = false;
    render();
  });
}

document.addEventListener('dragstart', (e)=> e.preventDefault());
document.addEventListener('selectstart', (e)=> e.preventDefault());

render();
</script>
